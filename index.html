
<h2 class="sr-only">KNÓR ON TOUR - z Czmelem, Katy Perry i kartony</h2>
<style>
*{margin:0;padding:0;box-sizing:border-box}
#gc{display:block;border-radius:12px 12px 0 0;touch-action:none}
.btn{background:#f5c542;color:#1a0000;border:none;padding:10px 22px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin:5px;letter-spacing:1px}
#ov{position:absolute;top:0;left:0;width:100%;height:calc(100% - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,2,0,0.96);border-radius:12px 12px 0 0;color:#f5c542;text-align:center;z-index:10}
#wrap{position:relative;width:100%;max-width:700px;margin:0 auto}
#ctrl{display:flex;justify-content:space-between;padding:8px;background:#120600;border-radius:0 0 12px 12px;height:56px}
.cb{background:rgba(245,197,66,0.12);border:1.5px solid #f5c542;color:#f5c542;padding:8px 12px;border-radius:8px;font-size:17px;cursor:pointer;user-select:none;-webkit-user-select:none;min-width:50px;display:flex;align-items:center;justify-content:center}
.cb:active,.cb.pressed{background:rgba(245,197,66,0.45)}
</style>
<div id="wrap">
<canvas id="gc" width="700" height="400"></canvas>
<div id="ov"><div id="ovc"></div></div>
<div id="ctrl">
  <div style="display:flex;gap:5px">
    <button class="cb" id="bL">◀</button>
    <button class="cb" id="bR">▶</button>
  </div>
  <button class="cb" id="bJ">↑</button>
  <button class="cb" id="bA">👊</button>
</div>
</div>
<script>
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
const W=700,H=400,GY=H-60,WW=4000;
let ST='menu',score=0,gt=0,camX=0;
let P,plats,cols,ens,bumblebee,boss,parts,floats;
let atkP=false,jmpP=false,shk=0,won=false;
let beerFlood=false,floodY=H+80,escapeTimer=0;
// Czmel state
let czmel={x:200,y:80,vx:1.2,vy:0,bobY:0,attackTimer:0,attackInterval:220,
  diving:false,diveY:0,diveTarget:0,stingProj:[],warning:false,warnTimer:0,active:false};
const K={l:false,r:false,j:false,a:false};

function init(){
  score=0;gt=0;camX=0;parts=[];floats=[];
  atkP=false;jmpP=false;shk=0;won=false;
  beerFlood=false;floodY=H+80;escapeTimer=0;
  P={x:80,y:GY-60,w:42,h:60,vx:0,vy:0,gr:false,hp:100,mhp:100,facing:1,atk:0,cd:0,hurt:0};
  czmel={x:300,y:70,vx:1.4,vy:0,bobY:0,bobT:0,
    attackTimer:0,attackInterval:200,
    diving:false,divePhase:0,stingX:0,stingY:0,
    stingProj:[],warning:false,warnTimer:0,active:true,
    hp:60,mhp:60,hurt:0,dying:0};

  plats=[
    {x:0,y:GY,w:WW,h:60,t:'g'},
    // regular platforms
    {x:220,y:GY-90,w:130,h:14,t:'p'},{x:420,y:GY-140,w:120,h:14,t:'p'},
    {x:620,y:GY-90,w:150,h:14,t:'p'},{x:880,y:GY-125,w:120,h:14,t:'p'},
    {x:1050,y:GY-75,w:180,h:14,t:'p'},{x:1350,y:GY-110,w:130,h:14,t:'p'},
    {x:1550,y:GY-160,w:120,h:14,t:'p'},{x:1750,y:GY-85,w:200,h:14,t:'p'},
    {x:2050,y:GY-120,w:140,h:14,t:'p'},{x:2350,y:GY-95,w:160,h:14,t:'p'},
    {x:2650,y:GY-135,w:120,h:14,t:'p'},{x:2850,y:GY-80,w:200,h:14,t:'p'},
    // brewery escape platforms
    {x:3050,y:GY-45,w:850,h:14,t:'b'},
    {x:3100,y:GY-130,w:120,h:14,t:'b'},{x:3280,y:GY-200,w:110,h:14,t:'b'},
    {x:3460,y:GY-260,w:120,h:14,t:'b'},{x:3630,y:GY-200,w:100,h:14,t:'b'},
    {x:3760,y:GY-265,w:130,h:14,t:'b'},
  ];

  // Only poisonous hotdogs (5), beer and pretzels for HP
  const rawCols=[
    {x:250,y:GY-130,t:'b'},{x:450,y:GY-185,t:'b'},{x:670,y:GY-135,t:'s'},
    {x:910,y:GY-170,t:'b'},{x:1090,y:GY-120,t:'s'},{x:1140,y:GY-75,t:'b'},
    {x:1390,y:GY-155,t:'b'},{x:1590,y:GY-210,t:'s'},{x:1790,y:GY-130,t:'b'},
    {x:2090,y:GY-165,t:'s'},{x:2390,y:GY-140,t:'b'},{x:2680,y:GY-182,t:'b'},
    {x:2890,y:GY-125,t:'s'},{x:170,y:GY-55,t:'b'},{x:540,y:GY-55,t:'s'},
    {x:1240,y:GY-55,t:'b'},{x:1650,y:GY-55,t:'s'},{x:2150,y:GY-55,t:'b'},
    {x:2550,y:GY-55,t:'s'},{x:2750,y:GY-55,t:'b'},
    // 5 poison hotdogs hidden as traps
    {x:500,y:GY-56,t:'hd'},{x:1100,y:GY-56,t:'hd'},{x:1800,y:GY-56,t:'hd'},
    {x:2400,y:GY-56,t:'hd'},{x:2900,y:GY-56,t:'hd'},
  ];
  cols=rawCols.map(c=>({...c,w:c.t==='hd'?30:26,h:c.t==='hd'?24:26,done:false,bob:Math.random()*6.28}));

  const ep=[
    {x:380,t:'box'},{x:580,t:'mole'},{x:820,t:'katy'},
    {x:1080,t:'box'},{x:1320,t:'mole'},{x:1570,t:'katy'},
    {x:1820,t:'mole'},{x:2080,t:'box'},{x:2320,t:'katy'},
    {x:2580,t:'mole'},{x:2820,t:'box'},{x:3100,t:'katy'},
  ];
  ens=ep.map(e=>({
    x:e.x,y:GY-(e.t==='katy'?60:44),
    w:e.t==='katy'?30:e.t==='mole'?32:38,
    h:e.t==='katy'?60:44,t:e.t,
    hp:e.t==='katy'?35:e.t==='mole'?30:22,
    mhp:e.t==='katy'?35:e.t==='mole'?30:22,
    vx:(Math.random()>.5?1:-1)*(e.t==='mole'?2.0:e.t==='katy'?1.4:0.9),
    facing:1,hurt:0,dying:0,hit:false,pm:e.x-90,px:e.x+90,
  }));

  boss={x:3350,y:GY-115,w:78,h:115,hp:360,mhp:360,
    vx:1.7,phase:1,at:0,hurt:0,proj:[],dying:0,exploding:0};
}

function spark(x,y,col,n=6,big=false){
  for(let i=0;i<n;i++)
    parts.push({x,y,vx:(Math.random()-.5)*(big?12:6),vy:(Math.random()-.5)*(big?10:5)-2,
      life:big?60+Math.random()*40:35+Math.random()*20,ml:big?100:55,col,r:big?6+Math.random()*8:3+Math.random()*4});
}
function hits(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function addFloat(x,y,txt,col){floats.push({x,y,txt,col,life:55,ml:55});}

// Check if player is sheltered under a platform (czmel can't hit)
function playerSheltered(){
  for(let pl of plats){
    if(pl.t==='g')continue;
    // player must be below and under the platform
    if(P.x+P.w>pl.x&&P.x<pl.x+pl.w&&P.y+P.h>pl.y+14&&P.y<pl.y+50) return true;
  }
  return false;
}

function updateCzmel(){
  if(!czmel.active||czmel.dying>0)return;
  if(czmel.hurt>0)czmel.hurt--;

  czmel.bobT+=0.05;
  czmel.bobY=Math.sin(czmel.bobT)*12;

  // Follow player horizontally, stay high
  const targetX=P.x+camX-W/2+W*.4;
  czmel.x+=(targetX-czmel.x)*0.008;
  czmel.x=Math.max(camX+20,Math.min(camX+W-80,czmel.x));

  const flyY=55+czmel.bobY;

  if(!czmel.diving){
    czmel.y+=(flyY-czmel.y)*0.05;
    czmel.attackTimer++;
    if(czmel.attackTimer>=czmel.attackInterval){
      czmel.attackTimer=0;
      // warn player
      czmel.warning=true;czmel.warnTimer=60;
      czmel.stingX=P.x+P.w/2;
      czmel.stingY=P.y; // target current player position
      setTimeout(()=>{
        if(czmel.active&&!czmel.dying){
          czmel.diving=true;czmel.divePhase=0;
        }
      },800);
    }
  } else {
    // Dive attack
    czmel.divePhase++;
    if(czmel.divePhase<30){
      // fast dive down toward stingX/stingY
      czmel.y+=(czmel.stingY-czmel.y)*0.18;
      czmel.x+=(czmel.stingX-czmel.x)*0.18;
    } else if(czmel.divePhase<50){
      // shoot sting projectile
      if(czmel.divePhase===30){
        czmel.stingProj.push({x:czmel.x,y:czmel.y+30,vx:0,vy:6,life:40});
        spark(czmel.x,czmel.y+20,'#f5c542',8);
      }
      czmel.y+=4;
    } else {
      // fly back up
      czmel.y-=3.5;
      if(czmel.y<=flyY+20){czmel.diving=false;czmel.divePhase=0;}
    }
  }

  if(czmel.warnTimer>0)czmel.warnTimer--;
  else czmel.warning=false;

  // Sting projectiles
  czmel.stingProj=czmel.stingProj.filter(p=>p.life>0);
  czmel.stingProj.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;
    if(P.hurt===0&&!playerSheltered()&&hits(P,{x:p.x-8,y:p.y-8,w:16,h:16})){
      P.hp-=18;P.vy=-5;P.hurt=70;shk=7;
      spark(P.x+P.w/2,P.y,'#f5c542',10);
      addFloat(P.x+P.w/2-camX,P.y-15,'🐝 BZZ! -18','#f5c542');
      p.life=0;
    }
  });

  // Direct contact when diving (only if not sheltered)
  if(czmel.diving&&P.hurt===0&&!playerSheltered()){
    const cb={x:czmel.x-30,y:czmel.y-20,w:60,h:50};
    if(hits(P,cb)){
      P.hp-=15;P.vy=-8;P.hurt=70;shk=8;
      spark(P.x+P.w/2,P.y+P.h/2,'#ffcc00',10);
      addFloat(P.x+P.w/2-camX,P.y-15,'🐝 -15','#ffcc00');
    }
  }

  // Player can punch czmel
  if(P.atk>4&&czmel.hurt===0){
    const ab={x:P.x+(P.facing>0?P.w-4:-50),y:P.y+8,w:54,h:38};
    const cb={x:czmel.x-30,y:czmel.y-20,w:60,h:50};
    if(hits(ab,cb)){
      czmel.hp-=25;czmel.hurt=20;shk=5;
      spark(czmel.x,czmel.y,'#ffcc00',10);
      addFloat(czmel.x-camX,czmel.y-20,'-25 HP 🐝','#ffcc00');
      if(czmel.hp<=0){
        czmel.dying=50;score+=150;
        spark(czmel.x,czmel.y,'#f5c542',20,true);
        addFloat(czmel.x-camX,czmel.y-20,'CZMEL POKONANY! +150','#f5c542');
        czmel.active=false;
      }
    }
  }
}

function update(){
  if(ST!=='play')return;
  gt++;if(shk>0)shk--;

  if(beerFlood){
    escapeTimer++;
    floodY-=0.85+(escapeTimer*0.004);
    if(P.y+P.h>=floodY){P.hp-=0.3;if(P.hp<=0){ST='over';showOv('over');return;}}
    if(P.y+P.h<GY-270&&P.x>3600){ST='win';showOv('win');return;}
  }

  if(K.l){P.vx=-3.8;P.facing=-1;}
  else if(K.r){P.vx=3.8;P.facing=1;}
  else P.vx*=0.65;
  if(jmpP&&P.gr){P.vy=-13;P.gr=false;spark(P.x+P.w/2,P.y+P.h,'#8b4010',3);}
  jmpP=false;
  P.vy=Math.min(P.vy+0.58,18);
  P.x+=P.vx;P.y+=P.vy;
  P.x=Math.max(0,Math.min(WW-P.w,P.x));
  P.gr=false;
  plats.forEach(pl=>{
    if(P.x+P.w>pl.x&&P.x<pl.x+pl.w&&P.vy>=0&&P.y+P.h>=pl.y&&P.y+P.h<=pl.y+P.vy+6){
      P.y=pl.y-P.h;P.vy=0;P.gr=true;
    }
  });
  if(P.y>H+100&&!beerFlood)P.hp=0;
  if(P.hp<=0&&ST==='play'){ST='over';showOv('over');return;}

  updateCzmel();

  if(P.cd>0)P.cd--;
  if(atkP&&P.cd===0){P.atk=18;P.cd=28;}
  atkP=false;
  if(P.atk>0)P.atk--;

  if(P.atk>4){
    const ab={x:P.x+(P.facing>0?P.w-4:-50),y:P.y+8,w:54,h:38};
    ens.forEach(e=>{
      if(e.dying>0||e.hp<=0)return;
      if(!e.hit&&hits(ab,e)){
        e.hit=true;e.hp-=22;e.hurt=14;e.vx=P.facing*3.5;shk=5;
        spark(e.x+e.w/2,e.y+e.h/3,'#ff6b6b',9);
        if(e.hp<=0){
          e.dying=35;score+=e.t==='katy'?45:e.t==='mole'?40:25;
          spark(e.x+e.w/2,e.y,'#f5c542',16);
          if(e.t==='katy')addFloat(e.x+e.w/2-camX,e.y-10,'🎤 ROAR!','#ff69b4');
        }
      }
    });
    if(boss&&!boss.dying&&!boss.exploding&&boss.hurt===0&&hits(ab,boss)){
      boss.hp-=17;boss.hurt=20;shk=8;
      spark(boss.x+boss.w/2,boss.y+boss.h/3,'#ff6b6b',12);
      if(boss.hp<=boss.mhp*.5&&boss.phase===1){boss.phase=2;boss.vx=3.2;spark(boss.x+boss.w/2,boss.y,'#ff2200',30);}
      if(boss.hp<=0&&!boss.exploding){
        boss.exploding=200;score+=700;
        for(let i=0;i<10;i++)setTimeout(()=>spark(boss.x+Math.random()*boss.w,boss.y+Math.random()*boss.h,'#ff6600',20,true),i*130);
        for(let i=0;i<6;i++)setTimeout(()=>spark(boss.x+boss.w/2,boss.y+boss.h/2,'#f5c542',25,true),i*220);
        setTimeout(()=>{beerFlood=true;addFloat(W/2+camX,200+camX,'🍺 PIWO PRZELEWA SIĘ!!!','#f5c542');},2000);
      }
    }
  } else ens.forEach(e=>e.hit=false);

  ens.forEach(e=>{
    if(e.dying>0){e.dying--;return;}if(e.hp<=0)return;
    if(e.hurt>0){e.hurt--;e.x+=e.vx*0.3;return;}
    e.x+=e.vx;e.facing=e.vx>0?1:-1;
    if(e.x<=e.pm||e.x>=e.px)e.vx*=-1;
    let og=false;
    plats.forEach(pl=>{if(e.x+e.w>pl.x&&e.x<pl.x+pl.w&&e.y+e.h>=pl.y&&e.y+e.h<=pl.y+20){e.y=pl.y-e.h;og=true;}});
    if(!og)e.y=Math.min(e.y+3,GY-e.h);
    if(P.hurt===0&&hits(P,e)){
      const dmg=e.t==='katy'?11:e.t==='mole'?9:7;
      P.hp-=dmg;P.vy=-7;P.vx=(P.x+P.w/2<e.x+e.w/2)?-5:5;
      P.hurt=70;shk=8;spark(P.x+P.w/2,P.y+P.h/2,'#ff4444',10);
      if(e.t==='katy')addFloat(P.x+P.w/2-camX,P.y-15,'🎵 FIREWORK!','#ff69b4');
    }
  });

  if(boss&&boss.exploding>0){boss.exploding--;return;}
  if(boss&&!boss.dying&&boss.hp>0){
    if(boss.hurt>0)boss.hurt--;
    boss.x+=boss.vx;if(boss.x<=3060||boss.x>=3560)boss.vx*=-1;
    boss.at++;
    const iv=boss.phase===1?78:44;
    if(boss.at>=iv){
      boss.at=0;const d=(P.x>boss.x)?1:-1;
      boss.proj.push({x:boss.x+boss.w/2,y:boss.y+50,vx:d*(boss.phase===1?5:7.5),vy:boss.phase===2?(Math.random()-.5)*4:0,life:140});
      if(boss.phase===2)boss.proj.push({x:boss.x+boss.w/2,y:boss.y+50,vx:d*6.5,vy:-3,life:140});
    }
    boss.proj=boss.proj.filter(p=>p.life>0);
    boss.proj.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;
      if(P.hurt===0&&hits(P,{x:p.x-9,y:p.y-9,w:18,h:18})){
        P.hp-=boss.phase===1?14:23;P.vy=-6;P.vx=(P.x>boss.x)?3:-3;
        P.hurt=70;shk=7;spark(P.x+P.w/2,P.y,'#ff6600',9);p.life=0;
      }
    });
  }

  cols.forEach(c=>{
    if(c.done)return;c.bob+=0.09;
    const cy=c.y+Math.sin(c.bob)*5;
    if(hits(P,{x:c.x-c.w/2,y:cy-c.h/2,w:c.w,h:c.h})){
      c.done=true;
      if(c.t==='b'){P.hp=Math.min(P.mhp,P.hp+15);score+=20;spark(c.x,cy,'#f5c542',10);addFloat(c.x-camX,cy-12,'+15 HP','#f5c542');}
      else if(c.t==='s'){P.hp=Math.min(P.mhp,P.hp+10);score+=10;spark(c.x,cy,'#ff9944',10);addFloat(c.x-camX,cy-12,'+10 HP','#ffaa44');}
      else if(c.t==='hd'){
        P.hp=Math.max(1,P.hp-22);shk=8;spark(c.x,cy,'#66ff00',16);spark(c.x,cy,'#00cc44',8);
        addFloat(c.x-camX,cy-12,'☠ CZOSNEK! -22','#66ff00');
      }
    }
  });

  if(P.hurt>0)P.hurt--;
  camX+=(P.x-W/2+P.w/2-camX)*0.13;
  camX=Math.max(0,Math.min(WW-W,camX));
  floats=floats.filter(f=>f.life>0);floats.forEach(f=>{f.y-=1.2;f.life--;});
  parts=parts.filter(p=>p.life>0);
}

// ===== DRAW CZMEL (Bumblebee Rambo) =====
function drawCzmel(cx){
  if(!czmel.active&&czmel.dying<=0)return;
  const cx2=czmel.x-cx,cy2=czmel.y;
  if(cx2<-100||cx2>W+100)return;

  ctx.save();ctx.translate(cx2,cy2);
  if(czmel.dying>0){ctx.globalAlpha=czmel.dying/50;ctx.rotate((50-czmel.dying)*0.08);}
  if(czmel.hurt>0&&Math.floor(czmel.hurt/4)%2===0)ctx.globalAlpha=0.3;

  const wf=Math.sin(gt*0.35)*8; // wing flap

  // WINGS - translucent, flapping
  ctx.save();ctx.globalAlpha*=0.7;
  ctx.fillStyle='rgba(200,230,255,0.6)';
  ctx.strokeStyle='rgba(150,180,220,0.8)';ctx.lineWidth=1;
  // left wing
  ctx.beginPath();ctx.ellipse(-28,-18+wf,22,12,-0.5,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  // right wing
  ctx.beginPath();ctx.ellipse(28,-18-wf,22,12,0.5,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  // small back wings
  ctx.beginPath();ctx.ellipse(-20,-8+wf*.5,14,7,-0.3,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(20,-8-wf*.5,14,7,0.3,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();

  // BODY - fat bumblebee stripes
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath();ctx.ellipse(0,5,26,32,0,0,Math.PI*2);ctx.fill();
  // yellow stripes
  ctx.fillStyle='#f5c542';
  ctx.beginPath();ctx.ellipse(0,-2,24,8,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,10,24,8,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,22,22,7,0,0,Math.PI*2);ctx.fill();
  // black stripes over
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.ellipse(0,4,23,5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,16,23,5,0,0,Math.PI*2);ctx.fill();

  // STINGER at bottom
  ctx.fillStyle='#888';
  ctx.beginPath();ctx.moveTo(-4,34);ctx.lineTo(4,34);ctx.lineTo(0,50);ctx.closePath();ctx.fill();
  ctx.fillStyle='#aaa';ctx.beginPath();ctx.moveTo(-2,36);ctx.lineTo(2,36);ctx.lineTo(0,48);ctx.closePath();ctx.fill();

  // ARMS - muscular fists
  ctx.fillStyle='#c88040';
  ctx.beginPath();ctx.ellipse(-32,2,12,9,-.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(32,2,12,9,.4,0,Math.PI*2);ctx.fill();
  // fists
  ctx.fillStyle='#a06030';
  ctx.beginPath();ctx.ellipse(-40,-2,10,9,-.3,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#c8a020';ctx.font='bold 17px monospace';ctx.textAlign='center';ctx.fillText('PIWOWAR PRIMATOR s.r.o.',b0+430,H-60-225);
  [[b0+60,230],[b0+210,250],[b0+620,220]].forEach(([cx2,ch])=>{
    ctx.fillStyle='#070402';ctx.fillRect(cx2-22,H-60-ch,44,ch);
    ctx.fillStyle='rgba(190,105,25,0.25)';for(let s=0;s<4;s++){const sm=(gt*.3+s*20)%88;ctx.beginPath();ctx.arc(cx2,H-60-ch-sm,4+sm*.28,0,6.28);ctx.fill();}
  });
  for(let row=0;row<10;row++){const off=row%2===0?0:44;for(let col=0;col<14;col++){const bx=(col*88+off-(cx*.017)%88+176)%W;const by=H-60-row*33-26;if(by<-8)continue;ctx.fillStyle=row%3===0?'#2e1406':'#1c0c04';ctx.fillRect(bx,by,82,26);ctx.fillStyle='#0e0602';ctx.fillRect(bx,by,82,2);ctx.fillRect(bx,by,2,26);}}
  for(let i=0;i<16;i++){const bx=((i*240+100)%WW)-cx*.85;if(bx<-30||bx>W+30)continue;ctx.fillStyle='#4a2008';ctx.beginPath();ctx.ellipse(bx,GY-17,14,18,0,0,6.28);ctx.fill();ctx.fillStyle='#7a3812';ctx.fillRect(bx-11,GY-20,22,3);ctx.fillRect(bx-11,GY-10,22,3);}
  for(let i=0;i<20;i++){const bx=i*210+30-cx*.45;if(bx<-80||bx>W+50)continue;const bh=50+i%6*26;ctx.fillStyle=i%2===0?'#180a04':'#100604';ctx.fillRect(bx,H-60-bh,50,bh);}
  ctx.fillStyle='#1a0e06';ctx.fillRect(0,GY,W,60);
  for(let t=Math.floor(cx/46)*46;t<cx+W+46;t+=46)ctx.fillRect(t-cx,GY,44,3);
}

function drawPlats(cx){
  plats.forEach(p=>{
    if(p.t==='g')return;const px=p.x-cx;if(px+p.w<0||px>W)return;
    ctx.fillStyle=p.t==='b'?'#4a2008':'#6a3c14';ctx.fillRect(px,p.y,p.w,p.h);
    ctx.fillStyle=p.t==='b'?'#7a3814':'#9a5820';ctx.fillRect(px,p.y,p.w,4);
    if(p.t==='b'){for(let i=0;i<7;i++){const bx=px+8+i*110;if(bx<-20||bx>W+20)continue;ctx.fillStyle='#5a2408';ctx.beginPath();ctx.ellipse(bx,p.y-13,13,16,0,0,6.28);ctx.fill();ctx.fillStyle='#7a3814';ctx.fillRect(bx-10,p.y-16,20,3);ctx.fillRect(bx-10,p.y-7,20,3);}}
  });
}

function drawCols(cx){
  cols.forEach(c=>{
    if(c.done)return;const cy=c.y+Math.sin(c.bob)*5,cx2=c.x-cx;if(cx2<-40||cx2>W+40)return;
    if(c.t==='b'){
      ctx.fillStyle='rgba(255,200,0,0.3)';ctx.beginPath();ctx.arc(cx2,cy,20,0,6.28);ctx.fill();
      ctx.fillStyle='#f0b800';ctx.fillRect(cx2-10,cy-14,20,26);ctx.fillStyle='#d09800';ctx.fillRect(cx2+10,cy-8,6,14);
      ctx.fillStyle='rgba(220,240,255,0.55)';ctx.fillRect(cx2-8,cy-12,8,16);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(cx2,cy-14,10,5,0,0,6.28);ctx.fill();
    } else if(c.t==='s'){
      ctx.fillStyle='rgba(255,160,50,0.3)';ctx.beginPath();ctx.arc(cx2,cy,18,0,6.28);ctx.fill();
      ctx.strokeStyle='#d48020';ctx.lineWidth=5.5;
      ctx.beginPath();ctx.arc(cx2,cy-4,7,Math.PI*.2,Math.PI*.8);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx2-5,cy-4);ctx.bezierCurveTo(cx2-12,cy+2,cx2-8,cy+12,cx2,cy+10);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx2+5,cy-4);ctx.bezierCurveTo(cx2+12,cy+2,cx2+8,cy+12,cx2,cy+10);ctx.stroke();
      [[-7,4],[7,4],[0,9]].forEach(([dx,dy])=>{ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(cx2+dx,cy+dy,2.5,0,6.28);ctx.fill();});
    } else {
      // poison hotdog
      ctx.fillStyle='rgba(80,255,0,0.25)';ctx.beginPath();ctx.arc(cx2,cy,22,0,6.28);ctx.fill();
      ctx.fillStyle='rgba(80,255,0,0.12)';ctx.beginPath();ctx.arc(cx2,cy,30,0,6.28);ctx.fill();
      ctx.fillStyle='#d49030';ctx.beginPath();ctx.ellipse(cx2,cy,15,9,0,0,6.28);ctx.fill();
      ctx.fillStyle='#b83010';ctx.beginPath();ctx.ellipse(cx2,cy+1,11,5,0,0,6.28);ctx.fill();
      ctx.lineWidth=3.5;ctx.strokeStyle='#44ff00';
      ctx.beginPath();ctx.moveTo(cx2-9,cy-1);ctx.quadraticCurveTo(cx2-2,cy-6,cx2+2,cy-1);ctx.quadraticCurveTo(cx2+6,cy+3,cx2+9,cy-1);ctx.stroke();
      [[cx2-2,cy-14,5],[cx2+4,cy-17,4],[cx2-6,cy-17,3.5]].forEach(([x,y,r])=>{ctx.fillStyle='rgba(80,255,0,0.5)';ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();});
      ctx.fillStyle='#66ff00';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('☠',cx2,cy-23);
      ctx.fillStyle='rgba(100,255,50,0.9)';ctx.font='bold 9px monospace';ctx.fillText('CZOSNEK',cx2,cy+18);
    }
  });
}

function drawParts(cx){
  parts.forEach(p=>{ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x-cx,p.y,p.r,0,6.28);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;});ctx.globalAlpha=1;
}

function drawFlood(cx){
  if(!beerFlood)return;
  ctx.fillStyle='rgba(190,120,10,0.84)';ctx.fillRect(0,floodY,W,H-floodY+10);
  ctx.fillStyle='rgba(255,245,220,0.92)';for(let i=0;i<14;i++){const bx=(i*55+gt*.6)%W;ctx.beginPath();ctx.arc(bx,floodY,11+Math.sin(gt*.06+i)*4,0,Math.PI*2);ctx.fill();}
  if(escapeTimer<200){ctx.fillStyle='rgba(255,60,0,0.9)';ctx.font='bold 15px monospace';ctx.textAlign='center';ctx.fillText('🍺 PIWO PRZELEWA SIĘ! UCIEKAJ NA GÓRĘ! 🍺',W/2,floodY-10);}
}

function drawBossEntity(cx){
  if(!boss)return;const bx=boss.x-cx;if(bx<-150||bx>W+150)return;
  const angry=boss.hp<boss.mhp*.5;
  if(boss.exploding>0){const sx=(Math.random()-.5)*(80-boss.exploding*.3);ctx.save();ctx.translate(bx+boss.w/2+sx,boss.y+boss.h/2);ctx.globalAlpha=boss.exploding/200;ctx.translate(-boss.w/2,-boss.h/2);drawRoman(0,-boss.h/2,boss.w,boss.h,true,false,0);ctx.restore();ctx.globalAlpha=1;return;}
  if(boss.hp<=0)return;
  const flick=boss.hurt>0&&Math.floor(boss.hurt/4)%2===0;
  drawRoman(bx,boss.y,boss.w,boss.h,angry,flick,boss.dying);
  if(!boss.dying&&boss.hp>0){
    const r=Math.max(0,boss.hp/boss.mhp);
    ctx.fillStyle='rgba(0,0,0,0.84)';ctx.fillRect(W/2-158,5,318,28);
    ctx.fillStyle='#180000';ctx.fillRect(W/2-156,7,314,24);
    ctx.fillStyle=angry?'#ff2200':'#bb0a0a';ctx.fillRect(W/2-156,7,314*r,24);
    ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(angry?'🤬 WKURWIONY ROMAN!!!':'🧔 ROMAN PIWOWAR',W/2,23);
  }
  boss.proj.forEach(p=>{ctx.fillStyle='#c09000';ctx.beginPath();ctx.arc(p.x-cx,p.y,9,0,6.28);ctx.fill();ctx.font='12px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍺',p.x-cx,p.y);});
}

function drawHUD(){
  const r=Math.max(0,P.hp/P.mhp);
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(8,8,156,24);ctx.fillStyle='#180000';ctx.fillRect(10,10,152,20);
  ctx.fillStyle=`hsl(${r*120},78%,42%)`;ctx.fillRect(10,10,152*r,20);
  ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText('HP '+Math.max(0,Math.ceil(P.hp)),86,24);
  ctx.fillStyle='#f5c542';ctx.font='bold 13px monospace';ctx.textAlign='right';ctx.fillText('🏆 '+score,W-8,26);
  ctx.fillStyle='rgba(0,0,0,0.68)';ctx.fillRect(8,H-26,245,18);
  ctx.font='9px monospace';ctx.textAlign='left';
  ctx.fillStyle='#f5c542';ctx.fillText('🍺+15HP  🥨+10HP',12,H-13);
  ctx.fillStyle='#66ff00';ctx.fillText('  ☠czosnkowy hotdog -22HP',110,H-13);
  if(P.cd===0){ctx.fillStyle='rgba(0,120,0,0.7)';ctx.fillRect(W-70,H-30,62,20);ctx.fillStyle='#ddd';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('ATAK!',W-39,H-16);}
  if(beerFlood){ctx.fillStyle='rgba(255,180,0,0.9)';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('⬆ WDRAP SIĘ NA GÓRĘ i uciekaj w prawo!',W/2,46);}
  else if(P.x>3000){ctx.fillStyle='rgba(255,60,0,0.92)';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('ROMAN CZEKA W BROWARZE!',W/2,46);}
  if(P.hurt>0){ctx.fillStyle='rgba(255,0,0,0.08)';ctx.fillRect(0,0,W,H);}
  drawShelterHint(camX);
  floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life/f.ml*2);ctx.fillStyle=f.col;ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y);});
  ctx.globalAlpha=1;
}

function drawLogo(){
  ctx.fillStyle='#040200';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(160,70,0,0.15)';ctx.beginPath();ctx.ellipse(W/2,H/2+30,320,140,0,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(180,100,0,0.55)';ctx.font='bold 62px monospace';ctx.textAlign='center';ctx.fillText('KNÓR',W/2+3,H/2-55);
  ctx.fillStyle='rgba(120,60,0,0.4)';ctx.font='bold 40px monospace';ctx.fillText('ON TOUR',W/2+2,H/2-8);
  ctx.fillStyle='#f5c542';ctx.font='bold 62px monospace';ctx.fillText('KNÓR',W/2,H/2-58);
  ctx.fillStyle='#ff8c00';ctx.font='bold 40px monospace';ctx.fillText('ON TOUR',W/2,H/2-11);
  ctx.strokeStyle='#b06000';ctx.lineWidth=1.5;ctx.strokeText('KNÓR',W/2,H/2-58);ctx.strokeText('ON TOUR',W/2,H/2-11);
  ctx.fillStyle='#e8b830';ctx.font='bold 15px monospace';ctx.textAlign='center';ctx.fillText('PRIMATOR NAHOD',W/2,H/2+22);
  ctx.fillStyle='#c8a020';ctx.font='bold 19px monospace';ctx.fillText('6-7 CZERWCA',W/2,H/2+44);
  ctx.fillStyle='rgba(200,150,20,0.5)';ctx.fillRect(W/2-130,H/2+12,260,2);ctx.fillRect(W/2-130,H/2+50,260,2);
  ctx.font='38px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍺',W/2-200,H/2-25);ctx.fillText('🍺',W/2+200,H/2-25);
  ctx.fillStyle='rgba(200,155,30,0.65)';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText('BEER  •  FIGHT  •  REPEAT',W/2,H/2+65);
  ctx.fillStyle='rgba(150,150,80,0.5)';ctx.font='10px monospace';ctx.fillText('wrogowie: 📦kartony  🐾kreciki  🎤Katy Perry  🐝Czmel',W/2,H/2+82);
}

let aid;
function loop(){
  update();
  if(ST==='play'){
    const sk=shk>0?(Math.random()-.5)*5:0;
    ctx.save();if(shk>0)ctx.translate(sk,sk*.5);
    drawBg(camX);drawPlats(camX);drawCols(camX);
    // draw enemies
    ens.forEach(e=>{
      if(e.hp<=0&&e.dying<=0)return;
      const ex=e.x-camX;if(ex<-70||ex>W+70)return;
      if(e.t==='mole')drawMole(e.x-camX,e.y,e.w,e.h,e.facing,e.hurt,e.dying);
      else if(e.t==='katy')drawKaty(e.x-camX,e.y,e.w,e.h,e.facing,e.hurt,e.dying);
      else drawBox(e.x-camX,e.y,e.w,e.h,e.hurt,e.dying);
      if(!e.dying&&e.hp>0){const r=e.hp/e.mhp;ctx.fillStyle='#200';ctx.fillRect(e.x-camX,e.y-9,e.w,5);ctx.fillStyle=`hsl(${r*120},75%,42%)`;ctx.fillRect(e.x-camX,e.y-9,e.w*r,5);}
    });
    drawBossEntity(camX);drawParts(camX);
    drawKnur(P.x-camX,P.y,P.w,P.h,P.facing,P.atk>4,Math.abs(P.vx)>.5,P.hurt);
    drawCzmel(camX);
    drawFlood(camX);
    ctx.restore();drawHUD();
  }
  aid=requestAnimationFrame(loop);
}

function showOv(t){
  const ov=document.getElementById('ov'),c=document.getElementById('ovc');
  ov.style.display='flex';
  if(t==='win'){c.innerHTML=`<h1 style="font-size:24px;text-shadow:0 0 10px #f5c542">🐗 KNÓR OCALAŁ!</h1><p style="font-size:14px;color:#f5c542;margin:7px 0">Roman pokonany! Czmel uciszony! Katy Perry uciekła!</p><p style="color:#aaa">Wynik: <b style="color:#f5c542">${score} pkt</b></p><p style="color:#c8a040;font-size:12px;margin-top:8px">PRIMATOR NAHOD 6-7 Czerwca 🍺</p><br><button class="btn" id="startBtn">🔄 Zagraj ponownie</button>`;}
  else{c.innerHTML=`<h1 style="font-size:19px">💀 KNÓR UTONĄŁ W PIWIE!</h1><p style="font-size:12px;color:#f5c542;margin:7px 0">Czmel użądlił, Katy zaśpiewała, Knór padł...</p><p style="color:#aaa">Wynik: <b style="color:#f5c542">${score} pkt</b></p><br><button class="btn" id="startBtn">🔄 Spróbuj ponownie</button>`;}
  document.getElementById('startBtn').onclick=startGame;
}

function startGame(){
  document.getElementById('ov').style.display='none';
  floats=[];parts=[];init();ST='play';if(aid)cancelAnimationFrame(aid);loop();
}

requestAnimationFrame(()=>{
  drawLogo();
  document.getElementById('ovc').innerHTML=`<div style="position:absolute;bottom:28px;left:0;right:0;text-align:center">
    <p style="color:#aaa;font-size:11px;margin-bottom:3px">SPACJA/Z = atak | ← → = ruch | ↑ = skok</p>
    <p style="color:#f5c542;font-size:10px;margin-bottom:3px">🐝 Czmel lata wysoko — schowaj się pod półką gdy atakuje!</p>
    <p style="color:#66ff00;font-size:10px;margin-bottom:8px">☠ zielone hotdogi = czosnek trucizna!</p>
    <button class="btn" id="startBtn">🐗 KNÓR ON TOUR!</button>
  </div>`;
  document.getElementById('startBtn').onclick=startGame;
});
document.getElementById('ov').style.display='flex';

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')K.l=true;if(e.key==='ArrowRight')K.r=true;
  if(e.key==='ArrowUp'&&!K.j){jmpP=true;K.j=true;}
  if((e.key===' '||e.key==='z'||e.key==='Z')&&!K.a){atkP=true;K.a=true;}
  if([' ','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')K.l=false;if(e.key==='ArrowRight')K.r=false;
  if(e.key==='ArrowUp')K.j=false;if(e.key===' '||e.key==='z'||e.key==='Z')K.a=false;
});
function addBtn(id,dn,up){
  const b=document.getElementById(id);
  b.addEventListener('touchstart',e=>{e.preventDefault();b.classList.add('pressed');dn();},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();b.classList.remove('pressed');if(up)up();},{passive:false});
  b.addEventListener('mousedown',()=>{b.classList.add('pressed');dn();});
  b.addEventListener('mouseup',()=>{b.classList.remove('pressed');if(up)up();});
}
addBtn('bL',()=>K.l=true,()=>K.l=false);
addBtn('bR',()=>K.r=true,()=>K.r=false);
addBtn('bJ',()=>{if(!K.j){jmpP=true;K.j=true;}},()=>K.j=false);
addBtn('bA',()=>{if(!K.a){atkP=true;K.a=true;}},()=>K.a=false);
</script>
