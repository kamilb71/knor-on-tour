<style>

#ov.titleScreen{

<body>
<div id="wrap">
<canvas id="gc"></canvas>
<div id="ov"><div id="ovc"></div></div>
<div id="ctrl">
  <button class="cb" id="bL">&#9664;</button>
  <button class="cb" id="bJ">&#8679;<br><span style="font-size:10px">SKOK</span></button>
  <button class="cb" id="bA">&#128080;</button>
  <button class="cb" id="bR">&#9654;</button>
  <button class="cb" id="bFS">&#x26F6;</button>
</div>
<div id="lvlBadge"></div>
</div>
<script>
const cv=document.getElementById('gc');
const ctx=cv.getContext('2d');
const GW=700,GH=400,GY=GH-60;
// Resize canvas to fill screen above pad
const badge=document.getElementById('lvlBadge');
function resizeCanvas(){
  const vw=window.innerWidth,vh=window.innerHeight,padH=80;
  const sc=Math.min(vw/GW,(vh-padH)/GH);
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(GW*dpr);
  cv.height=Math.round(GH*dpr);
  cv.style.width=GW*sc+'px';
  cv.style.height=GH*sc+'px';
  cv.style.imageRendering='crisp-edges';
  cv._dpr=dpr;
  const ov2=document.getElementById('ov');
  ov2.style.height=(GH*sc)+'px';
  ov2.style.width=(GW*sc)+'px';
  ov2.style.left=((vw-GW*sc)/2)+'px';
  ov2.style.top='0px';
  const ctrl=document.getElementById('ctrl');
  ctrl.style.width=GW*sc+'px';
  ctrl.style.marginLeft=((vw-GW*sc)/2)+'px';
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// Fullscreen + landscape lock
document.getElementById('bFS').onclick=()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen||function(){}).call(el);
    if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
  }else{
    (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||function(){}).call(document);
  }
};

// ---- LEVEL CONFIG ----
function lvlCfg(n){
  return[,
    {name:'WALDENBURG',WW:3300,bossX:2950,bossHP:300,hm:1.0, czI:999999},
    {name:'LAS',       WW:3300,bossX:2900,bossHP:300,hm:.75, czI:999999},
    {name:'AUTOSTRADA',WW:700, bossX:0,   bossHP:160,hm:.8, czI:999999},
    {name:'STACJA BENZYNOWA',WW:3300,bossX:2850,bossHP:360,hm:.9, czI:999999},
    {name:'BROWAR',    WW:3300,bossX:2900,bossHP:430,hm:1.55,czI:125},
  ][n];
}

let ST='menu',lv=1,totScore=0,score=0,scoreBanked=false,gt=0,camX=0,camY=0;
let P,plats,cols,ens,boss,parts,floats;
let atkP=false,jmpP=false,shk=0,won=false;
let beerFlood=false,floodY=GH+200,floodTimer=0;
let czmel,golab,highway;
const K={l:false,r:false,j:false,a:false};
let levelClearTimer=null;
function resetInput(){
  K.l=false;K.r=false;K.j=false;K.a=false;
  atkP=false;jmpP=false;
  if(P){P.vx=0;P.vy=0;P.atk=0;P.cd=0;P.gr=false;}
  document.querySelectorAll('.cb.pressed').forEach(b=>b.classList.remove('pressed'));
}

function finishLevel(){
  if(levelClearTimer){clearTimeout(levelClearTimer);levelClearTimer=null;}
  resetInput();
  ST=(lv<5)?'lc':'win';
  showOv(ST);
}

function buildLevel(n){
  const c=lvlCfg(n),WW=c.WW;
  score=0;scoreBanked=false;gt=0;camX=0;camY=0;parts=[];floats=[];
  if(levelClearTimer){clearTimeout(levelClearTimer);levelClearTimer=null;}
  resetInput();shk=0;won=false;
  beerFlood=false;floodY=GH+200;floodTimer=0;
  P={x:80,y:GY-60,w:42,h:60,vx:0,vy:0,gr:false,hp:100,mhp:100,facing:1,atk:0,cd:0,hurt:0};
  czmel={x:300,y:68,bobT:0,bobY:0,
    attackTimer:0,attackInterval:c.czI,
    diving:false,divePhase:0,stingX:0,stingY:0,
    stingProj:[],warning:false,warnTimer:0,active:true,
    hp:60,mhp:60,hurt:0,dying:0};

  if(n===1){
    // LVL1: PALESTYNA - dachy kamienic Walbrzych
    plats=[
      {x:0,y:GY,w:WW,h:60,t:'g'},
      // ulica z wrakami aut - same low platforms
      {x:80, y:GY-30,w:90, h:14,t:'car'},  // wrak auta
      {x:320,y:GY-30,w:90, h:14,t:'car'},
      {x:600,y:GY-30,w:90, h:14,t:'car'},
      // pierwsze kamienice - nizsze dachy
      {x:150, y:GY-95, w:160,h:14,t:'roof'},
      {x:380, y:GY-75, w:140,h:14,t:'roof'},
      {x:580, y:GY-110,w:130,h:14,t:'roof'},
      // balkony i rury
      {x:240, y:GY-145,w:70, h:10,t:'balc'},
      {x:490, y:GY-155,w:60, h:10,t:'balc'},
      {x:700, y:GY-90, w:150,h:14,t:'roof'},
      {x:720, y:GY-150,w:80, h:10,t:'balc'},
      // wyzsze kamienice
      {x:900, y:GY-80, w:180,h:14,t:'roof'},

}
function hits(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function addFloat(sx,sy,txt,col){floats.push({sx,sy,txt,col,life:55,ml:55});}

function playerSheltered(){
  for(let pl of plats){
    if(pl.t==='g')continue;
    if(P.x+P.w>pl.x&&P.x<pl.x+pl.w&&P.y+P.h>pl.y+14&&P.y<pl.y+50)return true;
  }
  return false;
}

function updGolab(){
  if(!golab)return;
  // dying animation - keep updating even when inactive
  if(golab.dying>0){
    golab.dying--;
    golab.y+=3;// fall down
    golab.x+=golab.facing*1.5;
    return;
  }
  if(!golab.active)return;
  if(golab.hurt>0)golab.hurt--;
  golab.x+=golab.vx;
  if(golab.x<camX+20){golab.vx=Math.abs(golab.vx);golab.facing=1;}
  if(golab.x>camX+GW-40){golab.vx=-Math.abs(golab.vx);golab.facing=-1;}
  golab.poopTimer++;
  if(golab.poopTimer>=golab.poopInterval){
    golab.poopTimer=0;
    // drop straight down from golab's current X
    golab.poop.push({x:golab.x,y:golab.y+20,vy:3,life:200,warn:20});
    addFloat(golab.x-camX,golab.y-camY-20,'gru-gru','#ddd');
  }
  golab.poop=golab.poop.filter(p=>p.life>0);
  golab.poop.forEach(p=>{
    if(p.warn>0){p.warn--;return;}
    // straight down, no tracking
    p.y+=p.vy;p.vy+=0.15;p.life--;
    if(p.y>=GY)p.life=0;
    if(P.hurt===0&&p.life>0&&
       p.x>P.x-8&&p.x<P.x+P.w+8&&
       p.y>P.y&&p.y<P.y+P.h){
      P.hp-=12;P.vy=-5;P.hurt=60;shk=5;
      addFloat(P.x+P.w/2-camX,P.y-camY-15,'GOLU SRAL! -12','#aaa');
      p.life=0;
    }
  });
  if(P.atk>4&&golab.hurt===0){
    const ab={x:P.x+(P.facing>0?P.w-4:-50),y:P.y+8,w:54,h:38};
    if(hits(ab,{x:golab.x-20,y:golab.y-15,w:40,h:30})){
      golab.hp-=20;golab.hurt=20;shk=4;spark(golab.x,golab.y,'#aaa',8);
      if(golab.hp<=0&&golab.active){
        golab.active=false;golab.dying=50;score+=80;
        spark(golab.x,golab.y,'#f5c542',14);
        spark(golab.x,golab.y,'#ccc',10);
        addFloat(golab.x-camX,golab.y-camY-20,'GOLAB POKONANY! +80','#f5c542');
      }
    }
  }
}

function updateCzmel(){
  if(czmel.dying>0){czmel.dying--; if(czmel.dying<=0){czmel.active=false;} return;}
  if(!czmel.active)return;
  if(czmel.hurt>0)czmel.hurt--;
  czmel.bobT+=0.05;czmel.bobY=Math.sin(czmel.bobT)*12;
  const targetX=P.x+camX-GW/2+GW*.4;
  czmel.x+=(targetX-czmel.x)*0.008;
  czmel.x=Math.max(camX+20,Math.min(camX+GW-80,czmel.x));
  const flyY=55+czmel.bobY;
  if(!czmel.diving){
    czmel.y+=(flyY-czmel.y)*0.05;
    czmel.attackTimer++;
    if(czmel.attackTimer>=czmel.attackInterval){
      czmel.attackTimer=0;czmel.warning=true;czmel.warnTimer=60;
      czmel.stingX=P.x+P.w/2;czmel.stingY=P.y;
      setTimeout(()=>{if(czmel.active&&!czmel.dying){czmel.diving=true;czmel.divePhase=0;}},800);
    }
  } else {
    czmel.divePhase++;
    if(czmel.divePhase<30){czmel.y+=(czmel.stingY-czmel.y)*0.18;czmel.x+=(czmel.stingX-czmel.x)*0.18;}
    else if(czmel.divePhase<50){if(czmel.divePhase===30){czmel.stingProj.push({x:czmel.x,y:czmel.y+30,vx:0,vy:6,life:40});spark(czmel.x,czmel.y+20,'#f5c542',8);}czmel.y+=4;}
    else{czmel.y-=3.5;if(czmel.y<=flyY+20){czmel.diving=false;czmel.divePhase=0;}}
  }
  if(czmel.warnTimer>0)czmel.warnTimer--;else czmel.warning=false;
  czmel.stingProj=czmel.stingProj.filter(p=>p.life>0);
  czmel.stingProj.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;
    if(P.hurt===0&&!playerSheltered()&&hits(P,{x:p.x-8,y:p.y-8,w:16,h:16})){
      P.hp-=18;P.vy=-5;P.hurt=70;shk=7;spark(P.x+P.w/2,P.y,'#f5c542',10);
      addFloat(P.x+P.w/2-camX,P.y-15,'BZZ! -18','#f5c542');p.life=0;
    }
  });
  if(czmel.diving&&P.hurt===0&&!playerSheltered()){
    const cb={x:czmel.x-30,y:czmel.y-20,w:60,h:50};
    if(hits(P,cb)){P.hp-=15;P.vy=-8;P.hurt=70;shk=8;addFloat(P.x+P.w/2-camX,P.y-15,'CZMEL -15','#ffcc00');}
  }
  if(P.atk>4&&czmel.hurt===0){
    const ab={x:P.x+(P.facing>0?P.w-4:-50),y:P.y+8,w:54,h:38};
    const cb={x:czmel.x-30,y:czmel.y-20,w:60,h:50};
    if(hits(ab,cb)){
      czmel.hp-=25;czmel.hurt=20;shk=5;spark(czmel.x,czmel.y,'#ffcc00',10);
      addFloat(czmel.x-camX,czmel.y-20,'-25 HP','#ffcc00');
      if(czmel.hp<=0){score+=150;spark(czmel.x,czmel.y,'#f5c542',24,true);addFloat(czmel.x-camX,czmel.y-camY-20,'CZMEL ZNIKA! +150','#f5c542');czmel.active=false;czmel.dying=0;}
    }
  }
}

function spawnRoadObstacle(){

  const t=types[Math.floor(Math.random()*types.length)];

  const spec={
    pacholek:{w:26,h:34,d:7,txt:'PACHOLEK!'}, radiowoz:{w:58,h:88,d:13,txt:'RADIOWÓZ!'},
    tir:{w:76,h:130,d:18,txt:'TIR!'}, dzik:{w:42,h:34,d:10,txt:'DZIK NA DRODZE!'},
    granica:{w:64,h:72,d:14,txt:'CZESKA STRAŻ!'}, roboty:{w:84,h:44,d:12,txt:'ROBOTY DROGOWE!'}
  }[t];
  highway.obs.push({t,x:lane-spec.w/2,y:-spec.h-20,w:spec.w,h:spec.h,d:spec.d,txt:spec.txt,hit:false,vy:highway.speed+Math.random()*1.4});
}
function updateHighway(){
  gt++;if(shk>0)shk--;
  if(P.hurt>0)P.hurt--;
  const leftEdge=125,rightEdge=575;
  if(K.l){P.vx-=0.85;P.facing=-1;}else if(K.r){P.vx+=0.85;P.facing=1;}else P.vx*=0.82;
  P.vx=Math.max(-7,Math.min(7,P.vx));
  P.x+=P.vx;P.x=Math.max(leftEdge,Math.min(rightEdge-P.w,P.x));
  P.y=GH-92+Math.sin(gt*.12)*2;

  highway.dist+=highway.speed;
  highway.speed=Math.min(7.2,4.2+highway.dist/1700+highway.heat*.05);
  highway.spawnT++;
  if(!highway.bossMode&&highway.spawnT>Math.max(28,72-highway.dist/70-highway.heat*2)){
    highway.spawnT=0;spawnRoadObstacle();
    if(Math.random()<0.22)spawnRoadObstacle();
  }
  highway.obs=highway.obs.filter(o=>o.y<GH+160&&!o.dead);
  highway.obs.forEach(o=>{
    o.y+=o.vy;
    if(!o.hit&&P.hurt===0&&rectHit(P,o)){
      o.hit=true;o.dead=true;P.hp-=o.d;P.hurt=55;shk=8;highway.heat+=2;
      spark(P.x+P.w/2,P.y+P.h/2,'#ff3300',12);
      addFloat(P.x+P.w/2,P.y-8,o.txt+' -'+o.d,'#ff8844');
    }
  });
  if(P.hp<=0){ST='over';showOv('over');return;}

  if(!highway.bossMode&&highway.dist>=highway.len){
    highway.bossMode=true;boss.active=true;boss.x=GW/2-boss.w/2;boss.y=30;boss.phase=1;highway.obs=[];highway.msgT=140;
    addFloat(GW/2,80,'KOMENDANT SUSZARKA!','#ff2222');
  }
  if(highway.bossMode&&boss&&boss.active&&boss.hp>0&&!boss.exploding){
    if(boss.hurt>0)boss.hurt--;
    if(boss.hp<=boss.mhp*.5&&boss.phase===1){boss.phase=2;boss.at=0;shk=14;spark(boss.x+boss.w/2,boss.y+boss.h/2,'#ff6600',35,true);addFloat(GW/2,90,'BMW EKSPLODUJE! TURBO SPRINT!','#ff6600');}
    if(boss.hp<=boss.mhp*.2&&boss.phase===2){boss.phase=3;boss.at=0;shk=16;spark(boss.x+boss.w/2,boss.y+boss.h/2,'#ff0000',40,true);addFloat(GW/2,90,'NIKT NIE UCIEKNIE PRZED KONTROLA!','#ff2222');}
    const target=P.x+P.w/2-boss.w/2;
    boss.x+=(target-boss.x)*(boss.phase===1?.012:boss.phase===2?.028:.02);
    boss.x=Math.max(130,Math.min(570-boss.w,boss.x));
    boss.at++;
    if(boss.phase===1&&boss.at%55===0){
      boss.proj.push({t:'mandat',x:boss.x+boss.w/2-12,y:boss.y+boss.h-5,w:24,h:28,vy:5.2,life:120,d:12});
      if(boss.at%165===0)highway.obs.push({t:'radiowoz',x:P.x-5,y:-90,w:66,h:88,d:14,txt:'BLOKADA!',hit:false,vy:5.2});
    }else if(boss.phase===2){
      if(boss.at%42===0)boss.proj.push({t:'mandat',x:boss.x+boss.w/2-16,y:boss.y+boss.h-5,w:32,h:28,vy:6.3,life:110,d:14});
      if(boss.at%120===0){highway.laserT=55;highway.laserX=P.x+P.w/2;addFloat(highway.laserX,45,'SUSZARKA LASER!','#ff0000');}
      if(highway.laserT>0){highway.laserT--;if(highway.laserT<26&&Math.abs(P.x+P.w/2-highway.laserX)<24&&P.hurt===0){P.hp-=18;P.hurt=60;shk=10;addFloat(P.x+P.w/2,P.y-8,'LASER -18','#ff0000');}}
    }else if(boss.phase===3){
      if(boss.at%38===0)boss.proj.push({t:'rakieta',x:boss.x+15+Math.random()*(boss.w-30),y:boss.y+boss.h-5,w:22,h:42,vy:7.0,life:100,d:18});
      if(boss.at%150===0){shk=18;addFloat(GW/2,70,'SYRENA OGŁUSZA!','#66aaff');P.vx*=.2;}
      if(boss.at%180===0){highway.obs.push({t:'radiowoz',x:150,y:-100,w:62,h:88,d:14,txt:'POSILKI!',hit:false,vy:6.4});highway.obs.push({t:'radiowoz',x:488,y:-100,w:62,h:88,d:14,txt:'POSILKI!',hit:false,vy:6.4});}
    }
    boss.proj=boss.proj.filter(p=>p.life>0&&p.y<GH+70);
    boss.proj.forEach(p=>{p.y+=p.vy;p.life--;if(P.hurt===0&&rectHit(P,p)){P.hp-=p.d;P.hurt=60;shk=9;p.life=0;spark(P.x+P.w/2,P.y+P.h/2,p.t==='rakieta'?'#ff3300':'#ffff66',12);addFloat(P.x+P.w/2,P.y-8,(p.t==='rakieta'?'RAKIETA':'MANDAT')+' -'+p.d,p.t==='rakieta'?'#ff3300':'#ffff66');}});
    if(atkP&&P.cd===0){P.cd=16;boss.hp-=18;boss.hurt=10;shk=5;spark(boss.x+boss.w/2,boss.y+boss.h/2,'#f5c542',10);addFloat(boss.x+boss.w/2,boss.y+boss.h+16,'KUFEL W SZYBE! -18','#f5c542');}
    if(P.cd>0)P.cd--;atkP=false;
    if(boss.hp<=0&&!boss.exploding){
      boss.exploding=130;score+=1200;shk=20;
      for(let i=0;i<12;i++)setTimeout(()=>spark(boss.x+Math.random()*boss.w,boss.y+Math.random()*boss.h,'#ff6600',20,true),i*90);
    }
  }
  if(boss&&boss.exploding>0){boss.exploding--;if(boss.exploding===1)finishLevel();return;}
  if(P.hp<=0){ST='over';showOv('over');return;}
  floats=floats.filter(f=>f.life>0);parts=parts.filter(p=>p.life>0);
}

function update(){
  if(ST!=='play'||!P)return;
  if(lv===3){updateHighway();return;}
  if(!plats)return;
  gt++;if(shk>0)shk--;
  if(beerFlood){
    floodTimer++;
    // FINAŁ: 15 sekund ucieczki w górę przez powódź piwną
    const ESCAPE_FRAMES=900;
    const prog=Math.min(floodTimer/ESCAPE_FRAMES,1);
    floodY=GH+200-(GH+700)*prog;
    const WW=lvlCfg(lv).WW;
    // WIN dopiero po 15 sekundach i gdy Knur jest wysoko przy prawym końcu mapy
    if(floodTimer>=ESCAPE_FRAMES && P.y<GY-330 && P.x>WW-560){
      finishLevel();
      return;
    }
    if(P.y+P.h>=floodY&&P.hurt===0){P.hp-=0.45;}
  }
  if(K.l){P.vx=-3.8;P.facing=-1;}else if(K.r){P.vx=3.8;P.facing=1;}else P.vx*=0.65;
  if(jmpP&&P.gr){P.vy=-13;P.gr=false;spark(P.x+P.w/2,P.y+P.h,'#8b4010',3);}
  jmpP=false;
  P.vy=Math.min(P.vy+0.58,18);P.x+=P.vx;P.y+=P.vy;
  P.x=Math.max(0,Math.min(lvlCfg(lv).WW-P.w,P.x));P.gr=false;
  plats.forEach(pl=>{
    if(P.x+P.w>pl.x&&P.x<pl.x+pl.w&&P.vy>=0&&P.y+P.h>=pl.y&&P.y+P.h<=pl.y+P.vy+6){P.y=pl.y-P.h;P.vy=0;P.gr=true;}
  });
  if(P.y>GH+100&&!beerFlood)P.hp=0;
  if(P.hp<=0&&ST==='play'){ST='over';showOv('over');return;}
  if(lv===1)updGolab();
  updateCzmel();
  if(P.cd>0)P.cd--;
  if(atkP&&P.cd===0){P.atk=18;P.cd=28;spark(P.x+(P.facing>0?P.w+8:-8),P.y+18,'#f5c542',5);}
  atkP=false;if(P.atk>0)P.atk--;
  if(P.atk>4){
    const ab={x:P.x+(P.facing>0?P.w-4:-50),y:P.y+8,w:54,h:38};
    ens.forEach(e=>{
      if(e.dying>0||e.hp<=0)return;
      if(!e.hit&&hits(ab,e)){
        e.hit=true;e.hp-=22;e.hurt=14;e.vx=P.facing*3.5;shk=5;
        spark(e.x+e.w/2,e.y+e.h/3,'#ff6b6b',9);
        // shout on hit - above enemy head in screen coords
        if(lv===1){
          const shouts={menel:'Bier einschenken!',punk:'ANARCHIA!',dress:'Serce biale mam!'};
          if(shouts[e.t])addFloat(e.x+e.w/2-camX, e.y-camY-20, shouts[e.t], e.t==='dress'?'#4444ff':'#ff4400');
        }else if(lv===2){
          const shouts={choinka:'GREENPEACE!',lekarz:'Salam alejkum!',inzynier:'Kebab!'};
          if(shouts[e.t])addFloat(e.x+e.w/2-camX,e.y-camY-20,shouts[e.t],e.t==='lekarz'?'#ff4444':'#ff8800');
        }else if(lv===4){
          const shouts={adept:'SZYBKA KOMBINACJA!',instr:'RZUT I KOPNIECIE!'};
          if(shouts[e.t])addFloat(e.x+e.w/2-camX,e.y-camY-20,shouts[e.t],e.t==='instr'?'#00aeea':'#111');
        }else if(lv>=5){
          const shouts={box:'RATUJ SLAWEK!',mole:'AHUJ!',katy:'ROAR!'};
          if(shouts[e.t])addFloat(e.x+e.w/2-camX,e.y-camY-20,shouts[e.t],e.t==='katy'?'#ff69b4':e.t==='mole'?'#ddd':'#f5c542');
        }
        if(e.hp<=0){e.dying=35;score+=lv===1?30:lv===2?35:lv===4?(e.t==='instr'?55:35):e.t==='katy'?45:e.t==='mole'?40:25;spark(e.x+e.w/2,e.y,'#f5c542',16);}
      }
    });
    if(lv>=5&&boss&&!boss.dying&&!boss.exploding&&boss.hurt===0&&hits(ab,boss)){
      boss.hp-=17;boss.hurt=20;shk=8;spark(boss.x+boss.w/2,boss.y+boss.h/3,'#ff6b6b',12);
      if(boss.hp<=boss.mhp*.5&&boss.phase===1){boss.phase=2;boss.vx=3.2;spark(boss.x+boss.w/2,boss.y,'#ff2200',30);}
      if(boss.hp<=0&&!boss.exploding){
        boss.exploding=200;score+=700;
        for(let i=0;i<10;i++)setTimeout(()=>spark(boss.x+Math.random()*boss.w,boss.y+Math.random()*boss.h,'#ff6600',20,true),i*130);
        setTimeout(()=>{beerFlood=true;},2000);
      }
    }
  } else ens.forEach(e=>e.hit=false);
  ens.forEach(e=>{
    if(e.dying>0){e.dying--;return;}if(e.hp<=0)return;
    if(e.hurt>0){e.hurt--;e.x+=e.vx*0.3;return;}
    e.x+=e.vx;e.facing=e.vx>0?1:-1;if(e.x<=e.pm||e.x>=e.px)e.vx*=-1;
    // random speech while patrolling
    if(lv===1&&Math.random()<0.002){
      const speech={
        menel:['Bier einschenken!','Noch ein Bier!','Ich bin kein Penner!','Jawohl!'],
        punk:['ANARCHIA!','System to wrog!','Oi Oi Oi!','No pasaran!'],
        dress:['Serce biale mam!','Tylko Gornik!','KSG na zawsze!','Ojciec uczyl mnie!','GORNIK WALBRZYCH!','GORNIK WALBRZYCH!','GORNIK WALBRZYCH!'],
      };
      const lines=speech[e.t];
      if(lines)addFloat(e.x+e.w/2-camX,e.y-camY-25,lines[Math.floor(Math.random()*lines.length)],
        e.t==='menel'?'#ff8800':e.t==='punk'?'#ff2200':'#4444ff');
    }
    if(lv===2&&Math.random()<0.002){
      const speech={
        choinka:['Pokoj zamiast ropy!','Greenpeace!','Ratujmy lasy!','Sadzcie drzewa!'],
        lekarz:['Salam alejkum!','Prosze sie zastosowac!','Recepta!','Zdrowie przede wszystkim!'],
        inzynier:['Kebab!','To jest policzone!','Norma!','Projekt zatwierdzony!'],
      };
      const lines=speech[e.t];
      if(lines)addFloat(e.x+e.w/2-camX,e.y-camY-25,lines[Math.floor(Math.random()*lines.length)],
        e.t==='choinka'?'#44cc44':e.t==='lekarz'?'#ff4444':'#ff8800');
    }
    if(lv===4&&Math.random()<0.003){
      const speech={adept:['GARDA!','KROK W BOK!','UNITED!','LOW KICK!'],instr:['ZARAZ BEDZIE RZUT!','Krav Maga United!','PRAWDZIWA WALKA!','KOLANO!']};
      const lines=speech[e.t];
      if(lines)addFloat(e.x+e.w/2-camX,e.y-camY-25,lines[Math.floor(Math.random()*lines.length)],e.t==='instr'?'#00aeea':'#111');
    }
    if(lv>=5&&Math.random()<0.003){
      const speech={box:['RATUJ SLAWEK!','RATUJ SLAWEK!'],mole:['AHUJ!','AHUJ!'],katy:['ROAR!','ROAR!']};
      const lines=speech[e.t];
      if(lines)addFloat(e.x+e.w/2-camX,e.y-camY-25,lines[Math.floor(Math.random()*lines.length)],e.t==='katy'?'#ff69b4':e.t==='mole'?'#ddd':'#f5c542');
    }
    let og=false;
    plats.forEach(pl=>{if(e.x+e.w>pl.x&&e.x<pl.x+pl.w&&e.y+e.h>=pl.y&&e.y+e.h<=pl.y+20){e.y=pl.y-e.h;og=true;}});
    if(!og)e.y=Math.min(e.y+3,GY-e.h);
    if(P.hurt===0&&hits(P,e)){
      const dmg=e.t==='katy'?11:e.t==='mole'?9:e.t==='choinka'?9:e.t==='lekarz'?8:e.t==='inzynier'?10:e.t==='instr'?13:e.t==='adept'?9:7;
      P.hp-=dmg;P.vy=-7;P.vx=(P.x+P.w/2<e.x+e.w/2)?-5:5;
      P.hurt=70;shk=8;spark(P.x+P.w/2,P.y+P.h/2,'#ff4444',10);
    }
  });

  // BARON WALDENBURG - LVL1 boss
  if(lv===1&&boss&&!boss.dying&&boss.hp>0&&!boss.exploding){
    if(boss.hurt>0)boss.hurt--;
    boss.glow=(boss.glow||0)+0.08;
    boss.x+=boss.vx;
    if(boss.x<=2760||boss.x>=3180)boss.vx*=-1;
    // Baron random German speech
    if(Math.random()<0.004){
      const ph2=boss.phase===2;
      const baronLines=ph2?
        ['DAS IST MEIN WALDENBURG!','Ich bin unsterblich!','Ihr werdet alle sterben!','NEIN NEIN NEIN!','Meine Grube! Meine Stadt!']:
        ['Raus aus meiner Stadt!','Waldenburg gehort mir!','Ich bin Baron von Waldenburg!','Arbeitet! Arbeitet!','Kein Durchkommen!'];
      addFloat(boss.x-camX, boss.y-camY-35,
        baronLines[Math.floor(Math.random()*baronLines.length)], ph2?'#cc88ff':'#8888ff');
    }
    // Phase 1: falling rocks - only when player is near boss
    boss.rockTimer=(boss.rockTimer||0)+1;
    const rockInt=boss.phase===1?90:55;
    const playerNearBoss=P.x>2600;
    if(boss.rockTimer>=rockInt){
      boss.rockTimer=0;
      if(playerNearBoss){
        boss.rocks=boss.rocks||[];
        boss.rocks.push({x:P.x+P.w/2+(Math.random()-.5)*80,y:-20,vy:1.5,w:18,h:18,life:300});
      }
    }
    boss.rocks=(boss.rocks||[]).filter(r=>r.life>0);
    boss.rocks.forEach(r=>{
      r.y+=r.vy;r.vy+=0.18;r.life--;
      if(r.y>GH)r.life=0;
      if(P.hurt===0&&hits(P,{x:r.x-r.w/2,y:r.y-r.h/2,w:r.w,h:r.h})){
        P.hp-=15;P.vy=-6;P.hurt=70;shk=7;
        addFloat(P.x+P.w/2-camX,P.y-camY-15,'KAMIEN! -15','#aaa');
        r.life=0;
      }
    });
    // Phase 2: teleport + zombie effect
    if(boss.phase===2){
      boss.teleTimer=(boss.teleTimer||0)+1;
      if(boss.teleTimer>=120){
        boss.teleTimer=0;
        // teleport to random spot in arena
        boss.x=2780+Math.random()*300;
        boss.glow=3;
        addFloat(boss.x-camX,boss.y-camY-20,'DAS IST MEIN WALDENBURG!','#88f');
        // zombie menele spawn effect
        boss.zombies=boss.zombies||[];
        for(let i=0;i<2;i++){
          boss.zombies.push({x:boss.x+(Math.random()-.5)*150,y:GY-45,
            vx:(Math.random()-.5)*1.5,life:200,alpha:0.7});
        }
      }
      boss.zombies=(boss.zombies||[]).filter(z=>z.life>0);
      boss.zombies.forEach(z=>{z.x+=z.vx;z.life--;
        if(P.hurt===0&&hits(P,{x:z.x-14,y:z.y-44,w:28,h:44})){
          P.hp-=8;P.hurt=50;shk=4;
        }
      });
    }
    // phase transition
    if(boss.hp<=boss.mhp*.5&&boss.phase===1){
      boss.phase=2;boss.vx*=1.5;
      addFloat(boss.x-camX,boss.y-camY-30,'DAS IST MEIN WALDENBURG!','#88f');
      spark(boss.x+boss.w/2,boss.y,'#8888ff',25,true);
    }
    // pickaxe swing attack - proj
    boss.at++;const iv2=boss.phase===1?160:90;
    if(boss.at>=iv2){boss.at=0;const d=(P.x>boss.x)?1:-1;
      boss.proj.push({x:boss.x+boss.w/2,y:boss.y+60,vx:d*3,vy:0,life:120,t:'pick'});
    }
    boss.proj=boss.proj.filter(p=>p.life>0);
    boss.proj.forEach(p=>{p.x+=p.vx;p.life--;
      if(P.hurt===0&&hits(P,{x:p.x-12,y:p.y-12,w:24,h:24})){
        P.hp-=16;P.vy=-5;P.vx=(P.x>boss.x)?3:-3;P.hurt=70;shk=7;
        addFloat(P.x+P.w/2-camX,P.y-camY-15,'KILOF! -16','#88f');p.life=0;
      }
    });
    // player hits baron
    if(P.atk>4&&boss.hurt===0){
      const ab={x:P.x+(P.facing>0?P.w-4:-50),y:P.y+8,w:54,h:38};
      if(hits(ab,boss)){
        boss.hp-=17;boss.hurt=20;shk=8;
        spark(boss.x+boss.w/2,boss.y+boss.h/3,'#8888ff',10);
        if(boss.hp<=0&&!boss.exploding){
          boss.exploding=180;score+=800;
          for(let i=0;i<10;i++)setTimeout(()=>spark(boss.x+Math.random()*boss.w,boss.y+Math.random()*boss.h,'#8888ff',20,true),i*120);
          for(let i=0;i<6;i++)setTimeout(()=>spark(boss.x+boss.w/2,boss.y,'#f5c542',25,true),i*200);
          // LVL1: level clear after explosion, no flood
          if(levelClearTimer)clearTimeout(levelClearTimer);
          levelClearTimer=setTimeout(()=>{
            if(lv===1&&ST==='play')finishLevel();
          },2500);
        }
      }
    }
  }

  // SWIADOMA ILONA - LVL2 boss
  if(lv===2&&boss&&!boss.dying&&boss.hp>0&&!boss.exploding){
    if(boss.hurt>0)boss.hurt--;
    boss.glowGreen=(boss.glowGreen||0)+0.07;
    boss.x+=boss.vx;
    if(boss.x<=2760||boss.x>=3180)boss.vx*=-1;
    if(Math.random()<0.004){
      const ph=boss.phase;
      const lines=ph===3?['NIE ZATRZYMACIE POSTEPU!','PLANETA PLONIE!','EKO TERAZ!']:
                  ph===2?['PROSZE SIE ZASTOSOWAC!','PANEL DYSKUSYJNY!','WAKE UP!']:
                  ['Czy masz slad weglowy?!','STOP SPALINOM!','RATUJMY LAS!','EKO FURIA!'];
      addFloat(boss.x-camX,boss.y-camY-35,lines[Math.floor(Math.random()*lines.length)],'#44cc44');
    }
    // Phase transitions
    if(boss.hp<=boss.mhp*.7&&boss.phase===1){
      boss.phase=2;boss.vx*=1.3;
      spark(boss.x+boss.w/2,boss.y,'#44ff44',25,true);
      boss.summons=boss.summons||[];
      const hm=lvlCfg(lv).hm;
      boss.summons.push({t:'lekarz',x:boss.x-110,y:GY-56,w:30,h:56,hp:Math.round(25*hm),mhp:Math.round(25*hm),vx:-0.9,hurt:0,dying:0,proj:[],atTimer:0});
      boss.summons.push({t:'inzynier',x:boss.x+110,y:GY-52,w:34,h:52,hp:Math.round(25*hm),mhp:Math.round(25*hm),vx:0.9,hurt:0,dying:0,proj:[],atTimer:0});
      addFloat(boss.x-110-camX,boss.y-camY-20,'PROSZE SIE ZASTOSOWAC!','#ff4444');
      addFloat(boss.x+110-camX,boss.y-camY-20,'TO JEST POLICZONE!','#ff8800');
    }
    if(boss.hp<=boss.mhp*.3&&boss.phase===2){
      boss.phase=3;boss.vx*=1.2;shk=12;
      addFloat(boss.x-camX,boss.y-camY-40,'NIE ZATRZYMACIE POSTEPU!','#00ff44');
      spark(boss.x+boss.w/2,boss.y,'#00ff44',40,true);
      boss.bigPizzaTimer=0;boss.bannerTimer=0;
    }
    // Pizza attack
    boss.at++;
    const ilonaIv=boss.phase===1?130:boss.phase===2?90:60;
    if(boss.at>=ilonaIv){
      boss.at=0;const d=(P.x>boss.x)?1:-1;
      boss.proj.push({x:boss.x+boss.w/2,y:boss.y+60,vx:d*(2.5+boss.phase*.4),vy:-2.5,life:220,bounces:0});
    }
    // Phase 3: giant pizza + falling banners
    if(boss.phase===3){
      boss.bigPizzaTimer=(boss.bigPizzaTimer||0)+1;
      if(boss.bigPizzaTimer>=240){
        boss.bigPizzaTimer=0;
        const fromLeft=(P.x>2960);
        boss.bigPizza={x:fromLeft?2740:3220,y:GY-90,vx:fromLeft?4:-4,w:100,h:80,life:130};
        addFloat(GW/2,GH/2-20,'GIGANTYCZNA PIZZA!','#ff6600');
      }
      boss.bannerTimer=(boss.bannerTimer||0)+1;
      if(boss.bannerTimer>=75){
        boss.bannerTimer=0;
        const btxts=['RATUJMY LAS','STOP SPALINOM','EKO TERAZ'];
        boss.banners=(boss.banners||[]);
        boss.banners.push({x:2770+Math.random()*380,y:-30,vy:2.8,txt:btxts[Math.floor(Math.random()*btxts.length)],life:140});
      }
    }
    // Update big pizza
    if(boss.bigPizza&&boss.bigPizza.life>0){
      boss.bigPizza.x+=boss.bigPizza.vx;boss.bigPizza.life--;

          }
        }
      }
    }
  }

  if(boss&&boss.exploding>0){boss.exploding--;return;}
  if(lv>=5&&boss&&!boss.dying&&boss.hp>0){

    const sx=(Math.random()-.5)*(80-boss.exploding*.3);
    ctx.save();ctx.translate(bx+boss.w/2+sx,by+boss.h/2);ctx.globalAlpha=boss.exploding/200;
    ctx.translate(-boss.w/2,-boss.h/2);
    _drawBaronBody(0,0,boss.w,boss.h,false,0);
    ctx.restore();ctx.globalAlpha=1;return;
  }
  if(boss.hp<=0)return;
  const flick=boss.hurt>0&&Math.floor(boss.hurt/4)%2===0;
  ctx.save();
  if(ph2){ctx.globalAlpha=0.65+Math.sin(glow)*0.2;}
  if(flick)ctx.globalAlpha=.3;
  _drawBaronBody(bx,by,boss.w,boss.h,ph2,glow);
  ctx.restore();ctx.globalAlpha=1;
  // Baron HP bar
  if(boss.hp>0){
    const r=Math.max(0,boss.hp/boss.mhp);
    ctx.fillStyle='rgba(0,0,0,.84)';ctx.fillRect(GW/2-153,5,308,24);
    ctx.fillStyle='#180018';ctx.fillRect(GW/2-151,7,304,20);
    ctx.fillStyle=ph2?'#8844ff':'#4444cc';ctx.fillRect(GW/2-151,7,304*r,20);
    ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText(ph2?'👻 WKURWIONY BARON!!!':'⛏ BARON WALDENBURG',GW/2,20);
  }
  // rocks
  (boss.rocks||[]).forEach(r=>{
    const rx=r.x-cx,ry=r.y-cy;
    // warning shadow on ground first
    if(r.y<GY-30){
      ctx.fillStyle='rgba(100,80,60,.3)';ctx.beginPath();ctx.ellipse(rx,GY-cy,r.w,4,0,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#7a6a5a';ctx.beginPath();ctx.arc(rx,ry,r.w/2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6a5a4a';ctx.beginPath();ctx.arc(rx-2,ry-2,r.w/2-3,0,Math.PI*2);ctx.fill();
  });
  // pickaxe projectile
  boss.proj.forEach(p=>{
    const px=p.x-cx,py=p.y-cy;
    ctx.fillStyle='#888';ctx.fillRect(px-12,py-3,24,6);
    ctx.fillStyle='#555';ctx.fillRect(px-14,py-6,8,8);ctx.fillRect(px+6,py-6,8,8);
  });
  // zombies
  (boss.zombies||[]).forEach(z=>{
    const zx=z.x-cx,zy=z.y-cy;
    ctx.globalAlpha=(z.life/200)*.7;
    ctx.fillStyle='#5a7a3a';ctx.fillRect(zx-12,zy-44,24,44);
    ctx.fillStyle='#4a6a30';ctx.beginPath();ctx.ellipse(zx,zy-50,10,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,0,0,.8)';ctx.beginPath();ctx.arc(zx-3,zy-52,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(zx+3,zy-52,2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
}

function _drawBaronBody(bx,by,bw,bh,ph2,glow){

  // BOOTS - tall black German military boots

  ctx.fillRect(-W2/2+2,H2/2-22,W2/2-4,22);ctx.fillRect(4,H2/2-22,W2/2-4,22);

  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(-W2/2+4,H2/2-20,5,14);ctx.fillRect(6,H2/2-20,5,14);

  // TUNIC - dark grey German military uniform

  // collar - high black
  ctx.fillStyle='#1a1a1a';

  ctx.fillStyle='#3a2a1a';
  ctx.fillRect(-12,H2/2-116,10,3);ctx.fillRect(2,H2/2-116,10,3);
  // GLOWING EYES

  ctx.beginPath();ctx.moveTo(0,H2/2-110);ctx.lineTo(-3,H2/2-104);ctx.lineTo(3,H2/2-104);ctx.closePath();ctx.fill();
  // thin stern mouth
  ctx.fillStyle='#7a5040';ctx.fillRect(-6,H2/2-101,12,3);
  // monocle! very German
  ctx.strokeStyle='#c8c870';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(7,H2/2-112,6,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#c8c870';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(13,H2/2-107);ctx.lineTo(16,H2/2-104);ctx.stroke();

  // phase 2 ghost effect
  if(ph2){
    ctx.fillStyle='rgba(150,100,255,0.15)';ctx.fillRect(-W2/2-5,H2/2-130,W2+10,130);
    ctx.fillStyle='rgba(180,150,255,0.6)';ctx.font='bold 7px monospace';ctx.textAlign='center';
    ctx.fillText('UNSTERBLICH!',0,H2/2-135);
  }
  ctx.restore();
}

// ===== SWIADOMA ILONA boss =====
function drawIlona(cx,cy){
  if(!boss||boss.hp<=0&&boss.exploding<=0)return;
  const bx=boss.x-cx,by=boss.y-cy;if(bx<-150||bx>GW+150)return;
  const ph3=boss.phase===3;
  const ph2=boss.phase>=2;
  if(boss.exploding>0){
    const sx=(Math.random()-.5)*(80-boss.exploding*.4);
    ctx.save();ctx.translate(bx+boss.w/2+sx,by+boss.h/2);ctx.globalAlpha=boss.exploding/160;
    ctx.translate(-boss.w/2,-boss.h/2);_drawIlonaBody(0,0,boss.w,boss.h,false,false,boss.glowGreen);
    ctx.restore();ctx.globalAlpha=1;return;
  }
  if(boss.hp<=0)return;
  const flick=boss.hurt>0&&Math.floor(boss.hurt/4)%2===0;
  ctx.save();if(flick)ctx.globalAlpha=.3;
  _drawIlonaBody(bx,by,boss.w,boss.h,ph2,ph3,boss.glowGreen||0);
  ctx.restore();ctx.globalAlpha=1;
  // HP bar
  if(boss.hp>0){
    const r=Math.max(0,boss.hp/boss.mhp);
    const angry=ph3;
    ctx.fillStyle='rgba(0,0,0,.84)';ctx.fillRect(GW/2-153,5,308,24);
    ctx.fillStyle='#001800';ctx.fillRect(GW/2-151,7,304,20);
    ctx.fillStyle=angry?'#00ff44':'#22aa22';ctx.fillRect(GW/2-151,7,304*r,20);
    ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText(angry?'🌳 SWIADOMA ILONA (FAZA 3)':ph2?'🌿 SWIADOMA ILONA (PANEL)':'🌱 SWIADOMA ILONA',GW/2,20);
  }
  // Pizza projectiles
  boss.proj.forEach(p=>{
    const px=p.x-cx,py=p.y-cy;
    ctx.save();ctx.translate(px,py);ctx.rotate(gt*.08);
    ctx.fillStyle='#e8c840';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
    // pizza toppings
    ctx.fillStyle='#cc4400';for(let i=0;i<6;i++){const a=i/6*Math.PI*2;ctx.beginPath();ctx.arc(Math.cos(a)*6,Math.sin(a)*6,2.5,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#228822';ctx.beginPath();ctx.arc(-2,2,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-3,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  // Big pizza
  if(boss.bigPizza&&boss.bigPizza.life>0){
    const bpx=boss.bigPizza.x-cx,bpy=boss.bigPizza.y-cy;
    ctx.save();ctx.translate(bpx+boss.bigPizza.w/2,bpy+boss.bigPizza.h/2);ctx.rotate(gt*.04);
    ctx.fillStyle='#e8c840';ctx.beginPath();ctx.arc(0,0,50,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#cc4400';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,50,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#228822';for(let i=0;i<8;i++){const a=i/8*Math.PI*2;ctx.beginPath();ctx.arc(Math.cos(a)*30,Math.sin(a)*30,7,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#ff2200';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('VEGAN',0,0);
    ctx.restore();
  }
  // Banners falling
  (boss.banners||[]).forEach(b=>{
    const bpx=b.x-cx,bpy=b.y-cy;
    ctx.fillStyle='rgba(30,150,30,0.9)';ctx.fillRect(bpx-30,bpy,60,20);
    ctx.fillStyle='#fff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText(b.txt,bpx,bpy+14);
    ctx.strokeStyle='#44ff44';ctx.lineWidth=1;ctx.strokeRect(bpx-30,bpy,60,20);
  });
  // Summons HP bars and draw
  (boss.summons||[]).forEach(s=>{
    if(s.hp<=0&&s.dying<=0)return;
    const sx=s.x-cx,sy=s.y-cy;
    if(sx<-70||sx>GW+70)return;
    if(s.t==='lekarz')drawLekarz(sx,sy,s.w,s.h,s.vx>0?1:-1,s.hurt,s.dying);
    else drawInzynier(sx,sy,s.w,s.h,s.vx>0?1:-1,s.hurt,s.dying);
    if(s.hp>0&&!s.dying){const r=s.hp/s.mhp;ctx.fillStyle='#200';ctx.fillRect(sx,sy-9,s.w,5);ctx.fillStyle=`hsl(${r*120},75%,42%)`;ctx.fillRect(sx,sy-9,s.w*r,5);}
    // Summon projectiles
    (s.proj||[]).forEach(p=>{
      const spx=p.x-cx,spy=p.y-cy;
      if(s.t==='lekarz'){ctx.fillStyle='#88aaff';ctx.fillRect(spx-6,spy-2,12,4);ctx.fillStyle='#555';ctx.fillRect(spx+6,spy-1.5,4,3);}
      else{ctx.fillStyle='#7a6a5a';ctx.beginPath();ctx.arc(spx,spy,5,0,Math.PI*2);ctx.fill();}
    });
  });
}

function drawBgLas(cx,cy){
  // Sky - forest dusk
  const sky=ctx.createLinearGradient(0,0,0,GH*.7);
  sky.addColorStop(0,'#1a2a0a');sky.addColorStop(0.6,'#2a4a10');sky.addColorStop(1,'#1a3a08');
  ctx.fillStyle=sky;ctx.fillRect(0,0,GW,GH);
  const WW=lvlCfg(2).WW;
  // Far trees (parallax bg)
  for(let i=0;i<22;i++){
    const tx=(i*180+40)-cx*.2;if(tx<-60||tx>GW+60)continue;
    const th=80+i%5*30;
    ctx.fillStyle=i%3===0?'#0d2a06':'#142e08';
    ctx.beginPath();ctx.moveTo(tx,GY-th+cy*.3);ctx.lineTo(tx-22,GY+cy*.3);ctx.lineTo(tx+22,GY+cy*.3);ctx.closePath();ctx.fill();
    ctx.fillStyle=i%2===0?'#1a3a0a':'#1e420c';
    ctx.beginPath();ctx.moveTo(tx,GY-th-20+cy*.3);ctx.lineTo(tx-15,GY-th+14+cy*.3);ctx.lineTo(tx+15,GY-th+14+cy*.3);ctx.closePath();ctx.fill();
  }
  // Mid trees
  for(let i=0;i<16;i++){
    const tx=(i*240+120)-cx*.55;if(tx<-80||tx>GW+80)continue;
    const th=100+i%4*40;
    // trunk
    ctx.fillStyle='#3a2208';ctx.fillRect(tx-7,GY-th+cy,14,th);
    // tree layers
    [[1.0,'#1a5a0a'],[0.7,'#228a10'],[0.4,'#2aaa16']].forEach(([yf,col],li)=>{
      ctx.fillStyle=col;
      const w=36-li*8,h=th*.4;
      ctx.beginPath();ctx.moveTo(tx,GY-th*yf+cy);ctx.lineTo(tx-w,GY-th*yf+h+cy);ctx.lineTo(tx+w,GY-th*yf+h+cy);ctx.closePath();ctx.fill();
    });
  }
  // CAMPFIRES scattered
  const fires=[{x:280},{x:720},{x:1200},{x:1680},{x:2150},{x:2600}];
  fires.forEach(f=>{
    const fx=f.x-cx;if(fx<-40||fx>GW+40)return;
    const fy=GY-6+cy;
    // logs
    ctx.fillStyle='#5a3010';ctx.fillRect(fx-18,fy-3,36,6);ctx.save();ctx.translate(fx,fy-3);ctx.rotate(.35);ctx.fillRect(-3,-16,6,16);ctx.rotate(-.7);ctx.fillRect(-3,-16,6,16);ctx.restore();
    // flame
    const fl=(gt*.1)%1;
    ctx.fillStyle=`rgba(255,${100+Math.sin(gt*.2)*50|0},0,0.9)`;ctx.beginPath();ctx.ellipse(fx,fy-8+Math.sin(gt*.3)*2,8,12+Math.sin(gt*.4)*3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,220,50,0.7)`;ctx.beginPath();ctx.ellipse(fx,fy-6+Math.sin(gt*.25)*2,4,8,0,0,Math.PI*2);ctx.fill();
    // smoke
    ctx.fillStyle='rgba(150,150,150,0.2)';for(let s=0;s<3;s++){const sm=(gt*.15+s*20)%40;ctx.beginPath();ctx.arc(fx+s-1,fy-20-sm,2+sm*.1,0,Math.PI*2);ctx.fill();}
  });
  // TENTS
  const tents=[{x:480},{x:960},{x:1450},{x:1920},{x:2400}];
  tents.forEach(t=>{
    const tx=t.x-cx;if(tx<-70||tx>GW+70)return;
    const ty=GY+cy;
    // tent body
    ctx.fillStyle='#884422';ctx.beginPath();ctx.moveTo(tx,ty-50);ctx.lineTo(tx-38,ty);ctx.lineTo(tx+38,ty);ctx.closePath();ctx.fill();
    ctx.fillStyle='#aa5530';ctx.beginPath();ctx.moveTo(tx,ty-52);ctx.lineTo(tx-10,ty-10);ctx.lineTo(tx+10,ty-10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#553318';ctx.fillRect(tx-12,ty-28,24,28);// entrance
    // ropes
    ctx.strokeStyle='#7a5a30';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(tx,ty-50);ctx.lineTo(tx-55,ty-8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(tx,ty-50);ctx.lineTo(tx+55,ty-8);ctx.stroke();
  });
  // VW SHARAN DIESEL - granatowy (dark navy) i srebrny (silver)
  const sharans=[{x:1050,col:'#1a2a5a',col2:'#141e40',win:'rgba(100,130,180,0.45)',label:'SHARAN'},{x:2080,col:'#8a9aaa',col2:'#6a7a88',win:'rgba(180,200,220,0.55)',label:'SHARAN'}];
  sharans.forEach(s=>{
    const sx=s.x-cx;if(sx<-120||sx>GW+120)return;
    const sy=GY+cy;
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(sx,sy+2,52,6,0,0,Math.PI*2);ctx.fill();
    // body lower (doors)
    ctx.fillStyle=s.col;ctx.fillRect(sx-52,sy-32,104,32);
    // body upper (roof - minivan profile)
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.moveTo(sx-48,sy-32);ctx.lineTo(sx-44,sy-54);ctx.lineTo(sx+36,sy-56);ctx.lineTo(sx+50,sy-32);ctx.closePath();ctx.fill();
    // roof highlight
    ctx.fillStyle=s.col2;ctx.fillRect(sx-40,sy-56,76,4);
    // front windscreen
    ctx.fillStyle=s.win;
    ctx.beginPath();ctx.moveTo(sx+24,sy-32);ctx.lineTo(sx+34,sy-53);ctx.lineTo(sx+48,sy-53);ctx.lineTo(sx+50,sy-32);ctx.closePath();ctx.fill();
    // rear windscreen
    ctx.beginPath();ctx.moveTo(sx-48,sy-32);ctx.lineTo(sx-42,sy-52);ctx.lineTo(sx-22,sy-54);ctx.lineTo(sx-22,sy-32);ctx.closePath();ctx.fill();
    // side windows (3 rows - sharan 7 osobowy)
    ctx.fillStyle=s.win;
    ctx.fillRect(sx-18,sy-52,16,18);ctx.fillRect(sx+2,sy-52,16,18);ctx.fillRect(sx+20,sy-52,12,18);
    // window frames
    ctx.strokeStyle=s.col2;ctx.lineWidth=1.5;ctx.strokeRect(sx-18,sy-52,16,18);ctx.strokeRect(sx+2,sy-52,16,18);ctx.strokeRect(sx+20,sy-52,12,18);
    // sliding door line
    ctx.strokeStyle=s.col2;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sx-2,sy-32);ctx.lineTo(sx-2,sy-54);ctx.stroke();
    // door handles
    ctx.fillStyle='#c8c8c8';ctx.fillRect(sx-14,sy-22,6,3);ctx.fillRect(sx+6,sy-22,6,3);ctx.fillRect(sx+22,sy-22,5,3);
    // front grille / bumper
    ctx.fillStyle='#2a2a2a';ctx.fillRect(sx+44,sy-18,8,18);// bumper front
    ctx.fillStyle='#1a1a1a';ctx.fillRect(sx+46,sy-28,8,10);// grille
    // VW logo (przód)
    ctx.fillStyle='#c8c8c8';ctx.beginPath();ctx.arc(sx+50,sy-24,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=s.col2;ctx.font='bold 5px monospace';ctx.textAlign='center';ctx.fillText('VW',sx+50,sy-22);
    // rear bumper
    ctx.fillStyle='#2a2a2a';ctx.fillRect(sx-52,sy-14,8,14);
    // WHEELS
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(sx-30,sy,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+30,sy,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';ctx.beginPath();ctx.arc(sx-30,sy,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+30,sy,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#888';for(let w=0;w<5;w++){const wa=w/5*Math.PI*2;ctx.beginPath();ctx.arc(sx-30+Math.cos(wa)*5,sy+Math.sin(wa)*5,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+30+Math.cos(wa)*5,sy+Math.sin(wa)*5,2,0,Math.PI*2);ctx.fill();}
    // DIESEL EXHAUST PIPE + BLACK SMOKE (kopcenie!)
    ctx.fillStyle='#555';ctx.fillRect(sx-54,sy-10,6,6);// rura wydechowa
    // thick black diesel smoke
    for(let sm=0;sm<6;sm++){
      const smt=(gt*.08+sm*18)%55;
      const smx=sx-58-smt*.6,smy=sy-10-smt*.8;
      ctx.globalAlpha=(1-smt/55)*.7;
      ctx.fillStyle=`rgb(${20+sm*4},${20+sm*4},${20+sm*4})`;
      ctx.beginPath();ctx.arc(smx,smy,4+smt*.12,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    // label "DIESEL" na rejestracji
    ctx.fillStyle='#eee';ctx.fillRect(sx-44,sy-6,28,10);
    ctx.fillStyle='#000';ctx.font='bold 5px monospace';ctx.textAlign='center';ctx.fillText('DIESEL',sx-30,sy+1);
  });
  // Forest ground - moss and roots
  ctx.fillStyle='#1a3a08';ctx.fillRect(0,GY+cy,GW,GH-GY);
  // roots/grass tufts
  ctx.strokeStyle='#2a5a10';ctx.lineWidth=2;
  for(let t=Math.floor(cx/35)*35;t<cx+GW+35;t+=35){
    const gr=(t%3);const ht=4+gr*3;
    ctx.beginPath();ctx.moveTo(t-cx,GY+cy);ctx.lineTo(t-cx-3,GY-ht+cy);ctx.moveTo(t-cx,GY+cy);ctx.lineTo(t-cx+4,GY-ht-2+cy);ctx.stroke();
  }
  // Graffiti / greenpeace slogans on tree bark
  const slogans=[
    {x:300,txt:'RATUJMY LAS!',col:'#44ff44'},{x:750,txt:'GREENPEACE',col:'#22cc22'},
    {x:1250,txt:'STOP WYCINKE',col:'#88ff44'},{x:1750,txt:'EKO TERAZ!',col:'#44ff88'},
    {x:2200,txt:'PLANETA PLONIE',col:'#ff8822'},{x:2700,txt:'ZONA CHRONIONA',col:'#44cc44'},
  ];
  slogans.forEach(g=>{
    const gx=g.x-cx;if(gx<-100||gx>GW+100)return;
    ctx.save();ctx.translate(gx,GY-60+cy);ctx.rotate((Math.random()-.5)*.1);
    ctx.globalAlpha=0.7;ctx.fillStyle=g.col;ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(g.txt,0,0);
    ctx.globalAlpha=1;ctx.restore();
  });
}

function drawBgWalbrzych(cx,cy){
  // Sky - overcast grey like Walbrzych
  const sky=ctx.createLinearGradient(0,0,0,GH*.6);
  sky.addColorStop(0,'#6a7a8a');sky.addColorStop(1,'#8a9aaa');
  ctx.fillStyle=sky;ctx.fillRect(0,0,GW,GH);

  // Background mountains/hills
  ctx.fillStyle='#5a6a5a';
  ctx.beginPath();ctx.moveTo(0,GH*.5);
  for(let x=0;x<=GW;x+=20){ctx.lineTo(x,GH*.5-Math.sin(x*.008+cx*.002)*40-Math.cos(x*.015)*25);}
  ctx.lineTo(GW,GH);ctx.lineTo(0,GH);ctx.closePath();ctx.fill();

  // Mining towers / szyby kopalniane (far background)
  const WW=lvlCfg(1).WW;
  const mineX=[800,1200,1800,2400,2800];
  mineX.forEach(mx=>{
    const bx=mx-cx*.3;if(bx<-80||bx>GW+50)return;
    const by=GH*.25;const mh=GH*.45;
    // tower frame
    ctx.fillStyle='#3a3a3a';ctx.fillRect(bx-6,by,12,mh);
    // wheel at top
    ctx.strokeStyle='#2a2a2a';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(bx,by,18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();for(let s=0;s<6;s++){const a=s/6*Math.PI*2;ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a)*16,by+Math.sin(a)*16);}ctx.stroke();
    // headframe
    ctx.fillStyle='#2a2a2a';
    ctx.beginPath();ctx.moveTo(bx-20,by+5);ctx.lineTo(bx,by-8);ctx.lineTo(bx+20,by+5);ctx.closePath();ctx.fill();
  });

  // FAR buildings parallax
  for(let i=0;i<18;i++){

    ctx.fillStyle='rgba(200,210,180,0.3)';
    for(let r=0;r<3;r++)for(let c=0;c<2;c++){

  // GRAFFITI on walls (fixed positions in world)
  const graffiti=[
    {x:350,txt:'ANARCHIA!',col:'#ff2200',r:-.08,y:80},{x:750,txt:'KSG!',col:'#1a1a8a',r:.05,y:95},
    {x:1100,txt:'KEBAB 24H',col:'#ff8800',r:-.04,y:75},{x:1500,txt:'SPOKO',col:'#22aa22',r:.1,y:88},
    {x:1900,txt:'WAS IST DAS?',col:'#ff2200',r:-.06,y:92},{x:2300,txt:'PALESTYNA!',col:'#1a1a8a',r:.07,y:82},
    {x:2700,txt:'WALDENBURG',col:'#8844ff',r:-.05,y:78},
  ];
  graffiti.forEach(g=>{
    const gx=g.x-cx;if(gx<-100||gx>GW+100)return;
    ctx.save();ctx.translate(gx,GY-g.y+cy);ctx.rotate(g.r);
    ctx.fillStyle=g.col;ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.globalAlpha=0.65;ctx.fillText(g.txt,0,0);ctx.globalAlpha=1;
    ctx.restore();
  });

  // WRAK aut on street
  const cars=[{x:120},{x:380},{x:680},{x:950},{x:1450},{x:1850},{x:2250},{x:2650}];
  cars.forEach(c=>{
    const cx2=c.x-cx;if(cx2<-80||cx2>GW+60)return;
    const cy2=GY-18+cy;

    ctx.fillStyle='#5a4030';ctx.fillRect(cx2-35,cy2-18,70,18);

    ctx.fillStyle='rgba(120,140,120,0.3)';ctx.fillRect(cx2-22,cy2-26,20,10);ctx.fillRect(cx2+2,cy2-26,20,10);
    // wheels
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(cx2-20,cy2,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx2+20,cy2,8,0,Math.PI*2);ctx.fill();
    // rust
    ctx.fillStyle='rgba(150,80,20,0.4)';for(let i=0;i<4;i++)ctx.fillRect(cx2-30+i*15,cy2-16,8,6);

function drawPlats(cx,cy){
  plats.forEach(p=>{
    if(p.t==='g')return;
    const px=p.x-cx,py=p.y-cy;
    if(px+p.w<0||px>GW||py>GH+10||py+p.h<-20)return;
    if(p.t==='roof'){
      // kamienica roof - red tiles
      ctx.fillStyle='#8a4030';ctx.fillRect(px,py,p.w,p.h);
      ctx.fillStyle='#aa5040';ctx.fillRect(px,py,p.w,4);
      // chimney
      ctx.fillStyle='#5a4030';ctx.fillRect(px+p.w*.7,py-14,10,14);
      ctx.fillStyle='#4a3020';ctx.fillRect(px+p.w*.7-2,py-16,14,4);
      // smoke
      ctx.fillStyle='rgba(180,180,180,0.3)';
      for(let s=0;s<2;s++){const sm=(gt*.2+s*15)%30;ctx.beginPath();ctx.arc(px+p.w*.7+5,py-16-sm,2+sm*.15,0,Math.PI*2);ctx.fill();}
    }else if(p.t==='balc'){
      // balkon - concrete
      ctx.fillStyle='#8a8a7a';ctx.fillRect(px,py,p.w,p.h);
      ctx.fillStyle='#9a9a8a';ctx.fillRect(px,py,p.w,3);
      // railing
      ctx.strokeStyle='#7a7a6a';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+p.w,py);ctx.stroke();
      for(let i=0;i<Math.floor(p.w/8);i++){ctx.beginPath();ctx.moveTo(px+4+i*8,py);ctx.lineTo(px+4+i*8,py+p.h+4);ctx.stroke();}
    }else if(p.t==='car'){
      // wrak auta as platform
      ctx.fillStyle='#5a4030';ctx.fillRect(px,py,p.w,p.h);
      ctx.fillStyle='#4a3020';ctx.fillRect(px+5,py-8,p.w-10,10);
      ctx.fillStyle='rgba(80,100,80,0.3)';ctx.fillRect(px+8,py-6,20,8);ctx.fillRect(px+p.w-28,py-6,20,8);
    }else if(p.t==='mine'){
      // szyb kopalniany platform - metal grating
      ctx.fillStyle='#4a4a3a';ctx.fillRect(px,py,p.w,p.h);
      ctx.strokeStyle='#3a3a2a';ctx.lineWidth=1.5;
      for(let i=0;i<Math.floor(p.w/8);i++){ctx.beginPath();ctx.moveTo(px+i*8,py);ctx.lineTo(px+i*8,py+p.h);ctx.stroke();}
      ctx.fillStyle='#5a5a4a';ctx.fillRect(px,py,p.w,3);
    }else if(p.t==='log'){
      // forest log platform
      ctx.fillStyle='#6a3a14';ctx.fillRect(px,py,p.w,p.h);
      ctx.fillStyle='#8a5020';ctx.fillRect(px,py,p.w,4);
      // bark lines
      ctx.strokeStyle='#5a2a08';ctx.lineWidth=1;
      for(let i=0;i<Math.floor(p.w/12);i++){ctx.beginPath();ctx.moveTo(px+4+i*12,py);ctx.lineTo(px+4+i*12,py+p.h);ctx.stroke();}
      // moss on top
      ctx.fillStyle='#2a6a10';ctx.fillRect(px,py,p.w,3);
    }else if(p.t==='rock'){
      // forest rock
      ctx.fillStyle='#6a6a5a';
      ctx.beginPath();ctx.moveTo(px+6,py+p.h);ctx.lineTo(px,py+8);ctx.lineTo(px+8,py);ctx.lineTo(px+p.w-8,py);ctx.lineTo(px+p.w,py+8);ctx.lineTo(px+p.w-4,py+p.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='#8a8a7a';ctx.fillRect(px+6,py,p.w-12,4);
      ctx.fillStyle='rgba(40,100,20,0.4)';ctx.fillRect(px,py,p.w,3);// moss
    }else if(p.t==='tent'){
      // tent roof as platform
      ctx.fillStyle='#884422';ctx.fillRect(px,py,p.w,p.h);
      ctx.fillStyle='#aa5530';ctx.fillRect(px,py,p.w,4);
      ctx.fillStyle='#6a3318';ctx.beginPath();ctx.moveTo(px+p.w/2,py-8);ctx.lineTo(px,py+2);ctx.lineTo(px+p.w,py+2);ctx.closePath();ctx.fill();
    }else if(p.t==='b'){
      ctx.fillStyle='#4a2008';ctx.fillRect(px,py,p.w,p.h);
      ctx.fillStyle='#7a3814';ctx.fillRect(px,py,p.w,4);
      for(let i=0;i<7;i++){const bx=px+8+i*110;if(bx<-20||bx>GW+20)continue;ctx.fillStyle='#5a2408';ctx.beginPath();ctx.ellipse(bx,py-13,13,16,0,0,6.28);ctx.fill();ctx.fillStyle='#7a3814';ctx.fillRect(bx-10,py-16,20,3);ctx.fillRect(bx-10,py-7,20,3);}
    }else{
      ctx.fillStyle='#6a3c14';ctx.fillRect(px,py,p.w,p.h);
      ctx.fillStyle='#9a5820';ctx.fillRect(px,py,p.w,4);
    }
  });
}

    ctx.fillRect(-ew*.36,-eh*.41,ew*.20,eh*.48);

    ctx.fillStyle='#c65a1c';
    ctx.beginPath();ctx.ellipse(ew*.43,-eh*.32,8,22,.05,0,6.28);ctx.fill();
    ctx.fillStyle='#00aeea';ctx.fillRect(ew*.32,-eh*.18,7,20);
  } 
  else if(fat){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-eh*.51,ew*.26,Math.PI,0);ctx.fill();ctx.fillStyle='#333';ctx.fillRect(-ew*.18,-eh*.27,ew*.36,7);} 
  else {ctx.fillStyle='#222';ctx.fillRect(-ew*.18,-eh*.51,ew*.36,9);}

let aid;
function loop(){
  update();
  const dpr=cv._dpr||1;
  // Clear BEFORE any transform to hit every physical pixel
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.globalAlpha=1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(ST==='play'){
    if(lv===3){
      const sk=shk>0?(Math.random()-.5)*5:0;
      if(shk>0)ctx.translate(sk,sk*.5);
      drawHighway();
      if(shk>0)ctx.translate(-sk,-sk*.5);
      aid=requestAnimationFrame(loop);
      return;
    }
    const sk=shk>0?(Math.random()-.5)*5:0;
    if(shk>0)ctx.translate(sk,sk*.5);
    drawBg(camX,camY);drawPlats(camX,camY);drawCols(camX,camY);
    ens.forEach(e=>{
      if(e.hp<=0&&e.dying<=0)return;const ex=e.x-camX,ey=e.y-camY;if(ex<-70||ex>GW+70)return;
      if(lv===1){
        if(e.t==='menel')drawMenel(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else if(e.t==='punk')drawPunk(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else if(e.t==='dress')drawDress(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else drawBox(ex,ey,e.w,e.h,e.hurt,e.dying);
      }else if(lv===2){
        if(e.t==='choinka')drawChoinka(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else if(e.t==='lekarz')drawLekarz(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else if(e.t==='inzynier')drawInzynier(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else drawBox(ex,ey,e.w,e.h,e.hurt,e.dying);
      }else if(lv===4){
        drawUKMFighter(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying,e.t);
      }else{
        if(e.t==='mole')drawMole(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else if(e.t==='katy')drawKaty(ex,ey,e.w,e.h,e.facing,e.hurt,e.dying);
        else drawBox(ex,ey,e.w,e.h,e.hurt,e.dying);
      }
      if(!e.dying&&e.hp>0){const r=e.hp/e.mhp;ctx.fillStyle='#200';ctx.fillRect(ex,ey-9,e.w,5);ctx.fillStyle=`hsl(${r*120},75%,42%)`;ctx.fillRect(ex,ey-9,e.w*r,5);}
    });
    if(lv===1){drawBaron(camX,camY);drawGolab(camX,camY);}
    else if(lv===2)drawIlona(camX,camY);
    else if(lv===4)drawUKMBoss(camX);
    else drawBossEntity(camX);
    drawParts(camX);
    drawKnur(P.x-camX,P.y-camY,P.w,P.h,P.facing,P.atk>4,Math.abs(P.vx)>.5,P.hurt);
    if(lv>=5)drawCzmel(camX,camY);
    drawFlood();
    if(shk>0)ctx.translate(-sk,-sk*.5);
    drawHUD();
  }
  aid=requestAnimationFrame(loop);
}

    {sp:'SPRANY ROBERT',face:'robert',txt:'Dobra. Moze jednak jestes spoko.'},
    {sp:'KRAVASIA',face:'kravasia',txt:'Ale mamy problem. Roman zniknal.'},
    {sp:'KNUR',face:'knur',txt:'Znowu?'},
    {sp:'TOMASZ MISZCZ',face:'tomasz',txt:'Ostatni raz widziano go w browarze.'},

    {sp:'KNUR',face:'knur',txt:'Za pozno. To brzmi jak katastrofa.'}
  ]},
  finale:{title:'FINALE: PRIMATOR',steps:[
    {sp:'SYSTEM',face:'none',txt:'Bialy blysk. Huk. Morze piwa. A potem cisza...'},
    {sp:'SYSTEM',face:'none',txt:'Primator. Stol w browarze. Na stole piwo, precle, kartony i przekaski.'},
    {sp:'SLAWEK',face:'slawek',txt:'Ale byla akcja.'},
    {sp:'KNUR',face:'knur',txt:'Troche byla. Browar wybuchl, Roman oszalal, Suszarka mial laser.'},
    {sp:'ROMAN',face:'roman',txt:'Jaki browar? Nic nie wybuchlo. Siedzisz tu od rana.'},
    {sp:'MACIEK',face:'maciek',txt:'Chcesz niebieska pigulke? Moze ci przejdzie.'},

    {sp:'KAMIL',face:'kamil',txt:'A tak w ogole... lubisz psy?'},

    {splash:'KNÓR ON TOUR',sp:'SYSTEM',face:'suszarka',txt:'W oddali miga niebiesko-czerwone swiatlo. Glos: NIKT NIE UCIEKNIE PRZED KONTROLA!'}

let cutKey=null,cutI=0,cutDone=null;
function htmlEscape(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showCutscene(key,done){
  const sc=CUTSCENES[key];
  if(!sc){ if(done)done(); return; }
  ST='cutscene';resetInput();cutKey=key;cutI=0;cutDone=done;
  renderCutscene();
}
function renderCutscene(){
  const ov2=document.getElementById('ov'),c2=document.getElementById('ovc');
  const sc=CUTSCENES[cutKey],step=sc.steps[cutI];
  ov2.style.display='flex';ov2.className='cutsceneScreen';
  const splash=step.splash?`<div class="cutNameSplash">${htmlEscape(step.splash)}</div>`:'';
  c2.innerHTML=`<div class="cutWrap">
    <div class="cutArt"><div class="cutSun"></div><div class="cutGrid"></div></div>
    ${splash}
    <div class="cutPanel">
      <div class="cutSceneTitle">${htmlEscape(sc.title)}</div>
      <div class="cutPortrait"><div class="cutFace ${htmlEscape(step.face||'none')}"></div></div>
      <div class="cutTextBox">
        <div class="cutSpeaker">${htmlEscape(step.sp||'')}</div>
        <div class="cutLine">${htmlEscape(step.txt||'')}</div>
        <div class="cutHint">TAP / KLIK / SPACJA — dalej (${cutI+1}/${sc.steps.length})</div>
      </div>
    </div>
  </div>`;
  c2.onclick=advanceCutscene;
}
function advanceCutscene(){
  if(ST!=='cutscene'||!cutKey)return;
  const sc=CUTSCENES[cutKey];
  cutI++;
  if(cutI>=sc.steps.length){
    const done=cutDone;cutKey=null;cutDone=null;
    resetInput();
    if(done)done();
  }else renderCutscene();
}
function renderWinOverlay(){
  const ov2=document.getElementById('ov'),c2=document.getElementById('ovc');
  ov2.style.display='flex';ov2.className='';
  c2.innerHTML=`<h1>KNOR TRIUMFUJE!</h1><p style="font-size:15px;color:#f5c542;margin:7px 0">Wszystkie 5 poziomow pokonane!</p><p style="color:#aaa">Wynik: <b style="color:#f5c542">${totScore} pkt</b></p><p style="color:#c8a040;margin-top:8px">Czy to byl sen? A moze KNÓR ON TOUR 2?</p><br><button class="btn" id="startBtn">Zagraj ponownie</button>`;
  document.getElementById('startBtn').onclick=()=>{lv=1;totScore=0;startGame();};
}

function showOv(t){
  resetInput();
  const ov2=document.getElementById('ov'),c2=document.getElementById('ovc');
  ov2.style.display='flex';
  ov2.className='';
  const names=['','WALDENBURG','LAS','AUTOSTRADA','STACJA BENZYNOWA','BROWAR'];
  const lcMsgs=['','Baron pokonany!','Ilona usiadla na pienku...','Komendant Suszarka zgubil radar!','United Krav Maga rozbite!','Roman odnaleziony!'];
  if((t==='lc'||t==='win')&&!scoreBanked){totScore+=score;scoreBanked=true;}
  if(t==='win'){
    showCutscene('finale',renderWinOverlay);
    return;
  }else if(t==='lc'){
    const nextName=names[lv+1]||'FINISH';
    c2.innerHTML=`<h1>POZIOM ${lv} ZALICZONY!</h1><p style="font-size:15px;color:#f5c542;margin:8px 0">${lcMsgs[lv]}</p><p style="color:#aaa">Wynik poziomu: <b style="color:#f5c542">${score} pkt</b></p><p style="color:#aaa">Suma: <b style="color:#f5c542">${totScore} pkt</b></p><p style="color:#f5c542;margin-top:8px">Nastepny: LVL ${lv+1} - ${nextName}</p><br><button class="btn" id="startBtn">CUTSCENKA I DALEJ!</button>`;
  }else{
    c2.innerHTML=`<h1>KNOR UTONOL!</h1><p style="color:#f5c542;margin:7px 0">Poziom ${lv}: ${names[lv]}</p><p style="color:#aaa">Wynik: <b style="color:#f5c542">${score} pkt</b></p><br><button class="btn" id="startBtn">Sprobuj ponownie</button><br><button class="btn" id="menuBtn" style="background:#555;color:#fff;margin-top:4px">Menu</button>`;
    const mb=document.getElementById('menuBtn');if(mb)mb.onclick=()=>{lv=1;totScore=0;showTitle();};
  }
  document.getElementById('startBtn').onclick=()=>{
    if(t==='lc'){
      const k='after'+lv;
      showCutscene(k,()=>{lv++;startGame();});
    }else startGame();
  };
}

function showTitle(){
  const ov2=document.getElementById('ov'),c2=document.getElementById('ovc');
  ov2.style.display='flex';
  ov2.className='titleScreen';
  c2.innerHTML=`<div class="titleBox">
    <div class="kicker">BRODATY DZIK • PIWO • ROZPIERDOL</div>
    <div class="epicTitle">KNÓR<span>ON TOUR</span></div>
    <div class="titleSparks">✦ ✦ ✦</div>
    <div class="heroCard">
      <div class="pixelKnur" aria-hidden="true">
        <div class="body"></div><div class="head"></div><div class="snout"></div><div class="eye"></div>
        <div class="band"></div><div class="tusk1"></div><div class="tusk2"></div><div class="belt"></div><div class="beer"></div><div class="legs"></div>
      </div>
      <div class="titleCopy">
        <p><b>Knur Rambo</b> rusza w trasę: opaska, pas nabojów i kufel w łapie.</p>
        <p>Lej meneli, punków, kartony, kreciki i bossów, aż browar zaleje morze piwa.</p>
        <p style="color:#66ff00!important">Uwaga: zielony hotdog z czosnkiem = trucizna.</p>
      </div>
    </div>
    <div class="levelStrip">
      <span class="levelPill">1 WALDENBURG</span><span class="levelPill">2 LAS</span><span class="levelPill">3 AUTOSTRADA</span><span class="levelPill">4 STACJA</span><span class="levelPill">5 BROWAR</span>
    </div>
    <button class="btn startEpic" id="startBtn">ODPAL KNURA!</button>
    <p class="tinyHint">Sterowanie: [&lt;][SKOK] lewy kciuk • [ATAK][&gt;] prawy kciuk • pełny ekran w rogu</p>
  </div>`;
  document.getElementById('startBtn').onclick=()=>showCutscene('intro',()=>startGame());
}

function startGame(){
  const ov=document.getElementById('ov');ov.style.display='none';ov.className='';
  resetInput();
  floats=[];parts=[];buildLevel(lv);ST='play';if(aid)cancelAnimationFrame(aid);loop();
}

requestAnimationFrame(()=>{
  resizeCanvas();drawLogo();
  lv=1;totScore=0;showTitle();
});
document.getElementById('ov').style.display='flex';

document.addEventListener('keydown',e=>{
  if(ST==='cutscene'&&(e.key===' '||e.key==='Enter')){e.preventDefault();advanceCutscene();return;}
  if(e.key==='ArrowLeft')K.l=true;if(e.key==='ArrowRight')K.r=true;
  if(e.key==='ArrowUp'&&!K.j){jmpP=true;K.j=true;}
  if((e.key===' '||e.key==='z'||e.key==='Z')&&!K.a){atkP=true;K.a=true;}
  if([' ','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});

window.addEventListener('blur',resetInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden)resetInput();});

document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')K.l=false;if(e.key==='ArrowRight')K.r=false;
  if(e.key==='ArrowUp')K.j=false;if(e.key===' '||e.key==='z'||e.key==='Z')K.a=false;
});
function addBtn(id,dn,up){
  const b=document.getElementById(id);if(!b)return;
  b.addEventListener('touchstart',e=>{e.preventDefault();b.classList.add('pressed');dn();},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();b.classList.remove('pressed');if(up)up();},{passive:false});
  b.addEventListener('touchcancel',e=>{e.preventDefault();b.classList.remove('pressed');if(up)up();},{passive:false});
  b.addEventListener('mousedown',()=>{b.classList.add('pressed');dn();});
  b.addEventListener('mouseup',()=>{b.classList.remove('pressed');if(up)up();});
}
addBtn('bL',()=>K.l=true,()=>K.l=false);
addBtn('bR',()=>K.r=true,()=>K.r=false);
addBtn('bJ',()=>{if(!K.j){jmpP=true;K.j=true;}},()=>K.j=false);
addBtn('bA',()=>{if(!K.a){atkP=true;K.a=true;}},()=>K.a=false);
</script>
